<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#651630">

<title>Admin Dashboard | Face of Style</title>

<style>
:root{
  --wine:#651630;
  --wine2:#7d1e3b;
  --gold:#c9a45b;
  --bg:#f7f2eb;
  --line:#e6dacf;
  --text:#292025;
  --muted:#756a6f;
  --white:#fff;
  --green:#16803c;
  --red:#a32626;
  --orange:#8a5a00;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  font-family:Arial,sans-serif;
  color:var(--text);
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.top{
  background:#fff;
  border-bottom:1px solid var(--line);
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:20;
}

.brand{
  font:22px Georgia;
  color:var(--wine);
}

.logout{
  background:#fff;
  border:1px solid var(--line);
  padding:9px 15px;
  border-radius:22px;
}

.layout{
  max-width:1440px;
  margin:auto;
  padding:22px 18px 50px;
}

/* LOGIN */

.login{
  max-width:410px;
  margin:9vh auto;
  background:#fff;
  padding:32px;
  border-radius:22px;
  box-shadow:0 12px 35px #32121b16;
}

.login h1,
.panel h2{
  font-family:Georgia;
  color:var(--wine);
}

.login h1{
  font-size:31px;
  margin:0 0 8px;
}

label{
  display:block;
  font-weight:bold;
  font-size:13px;
  margin-top:4px;
}

input,
select,
textarea{
  width:100%;
  padding:12px;
  border:1px solid var(--line);
  border-radius:11px;
  margin:7px 0 14px;
  background:#fff;
  color:var(--text);
}

textarea{
  min-height:105px;
  resize:vertical;
}

.primary,
.addBtn{
  background:var(--wine);
  color:#fff;
  border:0;
  padding:12px 18px;
  border-radius:23px;
  font-weight:bold;
}

.primary:hover,
.addBtn:hover{
  background:var(--wine2);
}

.secondary{
  background:#fff;
  color:var(--wine);
  border:1px solid var(--line);
  padding:10px 15px;
  border-radius:20px;
  font-weight:bold;
}

.error{
  color:var(--red);
  font-size:13px;
}

.success{
  color:var(--green);
  font-size:13px;
}

.notice{
  background:#fcf8f1;
  padding:13px;
  border-radius:11px;
  color:#665d60;
  font-size:13px;
  line-height:1.6;
}

.warning{
  background:#fff4d8;
  border:1px solid #efd28b;
  color:#795000;
  padding:13px;
  border-radius:11px;
  font-size:13px;
  line-height:1.6;
}

/* STATS */

.cards{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:14px;
}

.stat{
  background:#fff;
  border:1px solid var(--line);
  padding:18px;
  border-radius:17px;
}

.stat small{
  color:var(--muted);
}

.stat b{
  display:block;
  color:var(--wine);
  font-size:25px;
  margin-top:6px;
}

/* TABS */

.tabs{
  display:flex;
  gap:8px;
  margin:22px 0;
  flex-wrap:wrap;
}

.tab{
  padding:10px 17px;
  border:1px solid var(--line);
  background:#fff;
  border-radius:22px;
}

.tab.active{
  background:var(--wine);
  color:#fff;
}

/* PANELS */

.panel{
  background:#fff;
  border:1px solid var(--line);
  border-radius:19px;
  padding:20px;
  margin-bottom:20px;
}

.panelHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:15px;
}

.panel h2{
  font-size:25px;
  margin:0;
}

.search{
  max-width:360px;
}

/* PRODUCTS */

.productGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:17px;
}

.productCard{
  border:1px solid var(--line);
  border-radius:17px;
  overflow:hidden;
  background:#fff;
}

.productImage{
  width:100%;
  height:235px;
  object-fit:cover;
  background:#f4eee7;
  display:block;
}

.imageFallback{
  width:100%;
  height:235px;
  background:#f4eee7;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#999;
  font-size:13px;
}

.productInfo{
  padding:15px;
}

.productInfo h3{
  margin:0 0 7px;
  color:var(--wine);
  font-family:Georgia;
}

.productMeta{
  font-size:13px;
  color:#6d6367;
  line-height:1.7;
}

.productPrice{
  font-weight:bold;
  font-size:19px;
  margin:9px 0;
  color:var(--wine);
}

.productActions{
  display:flex;
  gap:8px;
}

.productActions button{
  flex:1;
  padding:9px;
  border-radius:18px;
  border:1px solid var(--line);
  background:#fff;
}

.edit{
  background:#fff8e8!important;
}

.delete{
  color:#9a2222!important;
}

/* FORMS */

.formGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0 16px;
}

.full{
  grid-column:1/-1;
}

.imageBox{
  border:1px dashed var(--line);
  background:#fcfaf7;
  border-radius:13px;
  padding:14px;
  margin-bottom:14px;
}

.imagePreview{
  width:100%;
  max-height:250px;
  object-fit:contain;
  background:#f4eee7;
  border-radius:12px;
  margin-top:10px;
}

/* TABLE */

.tableWrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1050px;
}

th,
td{
  text-align:left;
  padding:12px 10px;
  border-bottom:1px solid var(--line);
  vertical-align:top;
}

th{
  color:var(--wine);
  font-family:Georgia;
}

.pill{
  display:inline-block;
  padding:5px 9px;
  border-radius:14px;
  font-size:11px;
  font-weight:bold;
}

.paid{
  background:#e5f5ea;
  color:#176a35;
}

.pending{
  background:#fff1cf;
  color:#8a5a00;
}

.failed{
  background:#fde7e7;
  color:#9a2222;
}

.cancelled{
  background:#eee;
  color:#555;
}

.processing{
  background:#e8eefc;
  color:#284f9b;
}

.shipped{
  background:#eee8fb;
  color:#633d99;
}

.delivered{
  background:#e5f5ea;
  color:#176a35;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:50;
}

.modalBox{
  background:#fff;
  width:min(720px,100%);
  max-height:92vh;
  overflow:auto;
  border-radius:20px;
  padding:22px;
}

.modalHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.close{
  border:0;
  background:#f4eee7;
  border-radius:50%;
  width:38px;
  height:38px;
  font-size:22px;
}

.loading{
  padding:20px;
  text-align:center;
  color:var(--muted);
}

.empty{
  text-align:center;
  padding:30px;
  color:var(--muted);
}

.small{
  font-size:12px;
  color:var(--muted);
}

.settingGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.settingCard{
  border:1px solid var(--line);
  border-radius:15px;
  padding:16px;
  background:#fff;
}

.settingCard h3{
  margin-top:0;
  color:var(--wine);
  font-family:Georgia;
}

/* MOBILE */

@media(max-width:1100px){

  .cards{
    grid-template-columns:repeat(3,1fr);
  }

}

@media(max-width:850px){

  .cards{
    grid-template-columns:1fr 1fr;
  }

  .productGrid{
    grid-template-columns:1fr 1fr;
  }

  .settingGrid{
    grid-template-columns:1fr;
  }

}

@media(max-width:650px){

  .cards,
  .productGrid,
  .formGrid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .top{
    padding:12px 14px;
  }

  .brand{
    font-size:18px;
  }

  .layout{
    padding:16px 11px 40px;
  }

  .panel{
    padding:15px;
  }

  .panelHead{
    align-items:stretch;
    flex-direction:column;
  }

  .search{
    max-width:none;
  }
}
</style>
</head>

<body>

<div class="top">
  <b class="brand">FACE OF STYLE — ADMIN</b>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<div id="app"></div>

<script>

const app = document.getElementById("app");

let token =
  sessionStorage.getItem("adminToken") || "";

let allProducts = [];


/* =========================================================
   HELPERS
========================================================= */

function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function money(value){

  return "₦" +
    Number(value || 0)
      .toLocaleString("en-NG");

}


/*
   IMPORTANT:
   The server can return:
   image
   img
   /assets/product-1.jpg
   assets/product-1.jpg
   /product-1.jpg
*/
function normalizeImage(value){

  if(!value){
    return "";
  }

  let src = String(value).trim();

  if(!src){
    return "";
  }

  /*
     Do not display data URLs as product images.
     They were one of the causes of broken images.
  */
  if(src.startsWith("data:image/")){
    return "";
  }

  if(
    src.startsWith("http://") ||
    src.startsWith("https://") ||
    src.startsWith("/")
  ){
    return src;
  }

  if(src.startsWith("assets/")){
    return "/" + src;
  }

  if(src.startsWith("uploads/")){
    return "/" + src;
  }

  return "/" + src;
}


function imageHtml(product){

  const src =
    normalizeImage(
      product.image ||
      product.img
    );

  if(!src){

    return `
      <div class="imageFallback">
        No Product Image
      </div>
    `;

  }

  return `
    <img
      class="productImage"
      src="${esc(src)}"
      alt="${esc(product.name || "Product")}"
      loading="lazy"
      onerror="this.outerHTML='<div class=&quot;imageFallback&quot;>Image Not Found</div>'"
    >
  `;

}


/* =========================================================
   LOGIN
========================================================= */

function login(){

  app.innerHTML = `

    <div class="login">

      <h1>Admin Login</h1>

      <p>
        Face of Style Hijab Factory
      </p>

      <label>Username</label>

      <input
        id="username"
        value="admin"
        autocomplete="username"
      >

      <label>Password</label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
      >

      <button
        class="primary"
        style="width:100%"
        onclick="doLogin()"
      >
        LOGIN
      </button>

      <p
        id="loginError"
        class="error"
      ></p>

    </div>

  `;

}


async function doLogin(){

  const error =
    document.getElementById("loginError");

  error.textContent = "";

  try{

    const response =
      await fetch(
        "/api/admin/login",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({

            username:
              document
                .getElementById("username")
                .value
                .trim(),

            password:
              document
                .getElementById("password")
                .value

          })
        }
      );

    const data =
      await response.json();

    if(data.token){

      token = data.token;

      sessionStorage.setItem(
        "adminToken",
        token
      );

      dashboard();

    }else{

      error.textContent =
        data.message ||
        "Login failed.";

    }

  }catch(error){

    console.error(error);

    error.textContent =
      "Unable to connect to server.";

  }

}


/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

  try{

    if(token){

      await fetch(
        "/api/admin/logout",
        {
          method:"POST",
          headers:{
            Authorization:
              "Bearer " + token
          }
        }
      );

    }

  }catch(e){}

  sessionStorage.removeItem(
    "adminToken"
  );

  token = "";

  login();

}


/* =========================================================
   API HELPER
========================================================= */

async function api(url,options={}){

  options.headers = {

    ...(options.headers || {}),

    Authorization:
      "Bearer " + token

  };

  try{

    const response =
      await fetch(url,options);

    if(response.status === 401){

      logout();

      return null;

    }

    const text =
      await response.text();

    let data;

    try{

      data =
        JSON.parse(text);

    }catch(e){

      data = {

        error:
          text ||
          "Server returned invalid response."

      };

    }

    if(!response.ok){

      return {

        ...(data || {}),

        error:
          data?.message ||
          data?.error ||
          "Request failed."

      };

    }

    return data;

  }catch(error){

    console.error(error);

    return {
      error:
        "Unable to connect to server."
    };

  }

}


/* =========================================================
   DASHBOARD
========================================================= */

async function dashboard(){

  app.innerHTML = `

    <div class="layout">

      <div class="loading">
        Loading Admin Dashboard...
      </div>

    </div>

  `;

  const data =
    await api(
      "/api/admin/dashboard"
    );

  if(!data){

    return;

  }

  if(data.error){

    app.innerHTML = `

      <div class="layout">

        <div class="panel">

          <h2>Dashboard Error</h2>

          <p class="error">
            ${esc(data.error)}
          </p>

          <button
            class="primary"
            onclick="dashboard()"
          >
            TRY AGAIN
          </button>

        </div>

      </div>

    `;

    return;

  }

  const s =
    data.stats || {};

  app.innerHTML = `

    <div class="layout">

      <div class="cards">

        <div class="stat">
          <small>Total Orders</small>
          <b>${Number(s.orders || 0)}</b>
        </div>

        <div class="stat">
          <small>Paid Orders</small>
          <b>${Number(s.paid || 0)}</b>
        </div>

        <div class="stat">
          <small>Pending Orders</small>
          <b>${Number(s.pending || 0)}</b>
        </div>

        <div class="stat">
          <small>Processing</small>
          <b>${Number(s.processing || 0)}</b>
        </div>

        <div class="stat">
          <small>Revenue</small>
          <b>${money(s.revenue)}</b>
        </div>

      </div>


      <div class="tabs">

        <button
          id="tabOrders"
          class="tab active"
          onclick="showOrders()"
        >
          Orders
        </button>

        <button
          id="tabProducts"
          class="tab"
          onclick="showProducts()"
        >
          Products
        </button>

        <button
          id="tabSettings"
          class="tab"
          onclick="showSettings()"
        >
          Settings
        </button>

      </div>


      <div id="content"></div>

    </div>

  `;

  showOrders();

}


/* =========================================================
   ACTIVE TAB
========================================================= */

function activeTab(id){

  document
    .querySelectorAll(".tab")
    .forEach(
      button =>
        button.classList.remove(
          "active"
        )
    );

  const button =
    document.getElementById(id);

  if(button){

    button.classList.add(
      "active"
    );

  }

}


/* =========================================================
   ORDERS
========================================================= */

async function showOrders(){

  activeTab("tabOrders");

  const content =
    document.getElementById(
      "content"
    );

  content.innerHTML = `

    <div class="panel">

      <div class="panelHead">

        <h2>Customer Orders</h2>

        <button
          class="addBtn"
          onclick="showOrders()"
        >
          Refresh
        </button>

      </div>

      <div class="loading">
        Loading orders...
      </div>

    </div>

  `;

  const data =
    await api(
      "/api/admin/orders"
    );

  if(!data){

    return;

  }

  if(data.error){

    content.innerHTML = `

      <div class="panel">

        <h2>Orders</h2>

        <p class="error">
          ${esc(data.error)}
        </p>

      </div>

    `;

    return;

  }

  const orders =
    Array.isArray(data)
      ? data
      : (data.orders || []);


  if(!orders.length){

    content.innerHTML = `

      <div class="panel">

        <div class="panelHead">

          <h2>Customer Orders</h2>

          <button
            class="addBtn"
            onclick="showOrders()"
          >
            Refresh
          </button>

        </div>

        <div class="empty">
          No orders found.
        </div>

      </div>

    `;

    return;

  }


  content.innerHTML = `

    <div class="panel">

      <div class="panelHead">

        <h2>Customer Orders</h2>

        <button
          class="addBtn"
          onclick="showOrders()"
        >
          Refresh
        </button>

      </div>

      <div class="tableWrap">

        <table>

          <thead>

            <tr>

              <th>Reference</th>

              <th>Customer</th>

              <th>Contact</th>

              <th>Total</th>

              <th>Payment</th>

              <th>Order Status</th>

              <th>Date</th>

              <th>Action</th>

            </tr>

          </thead>

          <tbody>

            ${orders.map(order => {

              const payment =
                String(
                  order.payment_status ||
                  order.status ||
                  "PENDING"
                ).toUpperCase();

              const orderStatus =
                String(
                  order.order_status ||
                  order.orderStatus ||
                  "PENDING"
                ).toUpperCase();

              const paymentClass =
                payment === "PAID"
                  ? "paid"
                  : payment === "FAILED"
                    ? "failed"
                    : "pending";

              const statusClass =
                orderStatus.toLowerCase();

              return `

                <tr>

                  <td>

                    <b>
                      ${esc(
                        order.reference ||
                        "-"
                      )}
                    </b>

                    <br>

                    <span class="small">
                      Paystack:
                      ${esc(
                        order.paystack_reference ||
                        order.payment?.reference ||
                        "-"
                      )}
                    </span>

                  </td>


                  <td>

                    ${esc(
                      order.customer_name ||
                      order.customer?.name ||
                      "-"
                    )}

                    <br>

                    <span class="small">
                      ${esc(
                        order.customer_email ||
                        order.customer?.email ||
                        ""
                      )}
                    </span>

                  </td>


                  <td>

                    ${esc(
                      order.customer_phone ||
                      order.customer?.phone ||
                      "-"
                    )}

                    <br>

                    <span class="small">
                      ${esc(
                        order.delivery_address ||
                        order.customer?.address ||
                        ""
                      )}
                    </span>

                  </td>


                  <td>

                    <b>
                      ${money(order.total)}
                    </b>

                  </td>


                  <td>

                    <span
                      class="pill ${paymentClass}"
                    >
                      ${esc(payment)}
                    </span>

                  </td>


                  <td>

                    <span
                      class="pill ${statusClass}"
                    >
                      ${esc(orderStatus)}
                    </span>

                  </td>


                  <td>

                    ${
                      order.created_at ||
                      order.createdAt
                        ? new Date(
                            order.created_at ||
                            order.createdAt
                          ).toLocaleString(
                            "en-NG"
                          )
                        : "-"
                    }

                  </td>


                  <td>

                    <select
                      onchange="updateOrderStatus(
                        ${Number(order.id)},
                        this.value
                      )"
                    >

                      ${[
                        "PENDING",
                        "PROCESSING",
                        "SHIPPED",
                        "DELIVERED",
                        "CANCELLED"
                      ].map(status => `

                        <option
                          value="${status}"
                          ${
                            status === orderStatus
                              ? "selected"
                              : ""
                          }
                        >
                          ${status}
                        </option>

                      `).join("")}

                    </select>

                  </td>

                </tr>

              `;

            }).join("")}

          </tbody>

        </table>

      </div>

    </div>

  `;

}


/* =========================================================
   UPDATE ORDER STATUS
========================================================= */

async function updateOrderStatus(
  id,
  status
){

  if(!id){

    return;

  }

  const data =
    await api(
      "/api/admin/orders/" + id,
      {
        method:"PATCH",
        headers:{
          "Content-Type":
            "application/json"
        },
        body:JSON.stringify({

          order_status:
            status

        })
      }
    );

  if(data?.error){

    alert(
      data.error
    );

    showOrders();

    return;

  }

  showOrders();

}


/* =========================================================
   PRODUCTS
========================================================= */

async function showProducts(){

  activeTab("tabProducts");

  const content =
    document.getElementById(
      "content"
    );

  content.innerHTML = `

    <div class="panel">

      <div class="panelHead">

        <h2>Products</h2>

        <button
          class="addBtn"
          onclick="showAddProduct()"
        >
          + Add Product
        </button>

      </div>

      <div class="loading">
        Loading products...
      </div>

    </div>

  `;


  const data =
    await api(
      "/api/admin/products"
    );

  if(!data){

    return;

  }


  if(data.error){

    content.innerHTML = `

      <div class="panel">

        <h2>Products</h2>

        <p class="error">
          ${esc(data.error)}
        </p>

      </div>

    `;

    return;

  }


  allProducts =
    Array.isArray(data)
      ? data
      : (data.products || []);


  renderProducts(
    allProducts
  );

}


/* =========================================================
   RENDER PRODUCTS
========================================================= */

function renderProducts(
  products
){

  const content =
    document.getElementById(
      "content"
    );

  content.innerHTML = `

    <div class="panel">

      <div class="panelHead">

        <h2>Products</h2>

        <button
          class="addBtn"
          onclick="showAddProduct()"
        >
          + Add Product
        </button>

      </div>

      <input
        class="search"
        id="productSearch"
        placeholder="Search products..."
        oninput="filterProducts(this.value)"
      >

      <div
        id="productsList"
        class="productGrid"
        style="margin-top:15px"
      ></div>

    </div>

  `;

  drawProductCards(
    products
  );

}


/* =========================================================
   FILTER PRODUCTS
========================================================= */

function filterProducts(
  query
){

  const q =
    String(query || "")
      .toLowerCase()
      .trim();

  const filtered =
    allProducts.filter(
      product => {

        const name =
          String(
            product.name || ""
          ).toLowerCase();

        const category =
          String(
            product.category ||
            product.cat ||
            ""
          ).toLowerCase();

        const color =
          String(
            product.color || ""
          ).toLowerCase();

        return (
          name.includes(q) ||
          category.includes(q) ||
          color.includes(q)
        );

      }
    );

  drawProductCards(
    filtered
  );

}


/* =========================================================
   PRODUCT CARDS
========================================================= */

function drawProductCards(
  products
){

  const list =
    document.getElementById(
      "productsList"
    );

  if(!list){

    return;

  }


  if(!products.length){

    list.innerHTML = `

      <div
        class="empty"
        style="grid-column:1/-1"
      >
        No products found.
      </div>

    `;

    return;

  }


  list.innerHTML =
    products.map(product => {

      const category =
        product.category ||
        product.cat ||
        "Fashion";

      const description =
        product.description ||
        product.desc ||
        "";

      const stock =
        Number(
          product.stock || 0
        );

      return `

        <div class="productCard">

          ${imageHtml(product)}

          <div class="productInfo">

            <h3>
              ${esc(
                product.name ||
                "Unnamed Product"
              )}
            </h3>

            <div class="productMeta">

              Category:
              ${esc(category)}

              <br>

              Color:
              ${esc(
                product.color ||
                "-"
              )}

              <br>

              Stock:
              ${stock}

            </div>

            <div class="productPrice">

              ${money(
                product.price
              )}

            </div>

            ${
              description
                ? `
                  <div
                    class="small"
                    style="margin-bottom:10px"
                  >
                    ${esc(
                      description
                    )}
                  </div>
                `
                : ""
            }

            <div class="productActions">

              <button
                class="edit"
                onclick="editProduct(
                  ${Number(product.id)}
                )"
              >
                Edit
              </button>

              <button
                class="delete"
                onclick="deleteProduct(
                  ${Number(product.id)}
                )"
              >
                Delete
              </button>

            </div>

          </div>

        </div>

      `;

    }).join("");

}

/* =========================================================
   PREVIEW IMAGE
========================================================= */

function previewProductImage(){

  const value =
    document
      .getElementById(
        "productImage"
      )
      .value
      .trim();

  const box =
    document.getElementById(
      "productImagePreview"
    );

  if(!value){

    box.innerHTML = "";

    return;

  }

  const src =
    normalizeImage(value);

  box.innerHTML = `

    <img
      class="imagePreview"
      src="${esc(src)}"
      onerror="
        this.style.display='none';
        document.getElementById('productImagePreview').insertAdjacentHTML(
          'beforeend',
          '<p class=&quot;error&quot;>Image URL not found.</p>'
        )
      "
    >

  `;

}

function closeModal(){

}


/* =========================================================
   SAVE PRODUCT
========================================================= */

async function saveProduct(
  id
){

  const message =
    document.getElementById(
      "productMessage"
    );

  const name =
    document
      .getElementById(
        "productName"
      )
      .value
      .trim();

  const category =
    document
      .getElementById(
        "productCategory"
      )
      .value;

  const price =
    Number(
      document
        .getElementById(
          "productPrice"
        )
        .value
    );

  const stock =
    Number(
      document
        .getElementById(
          "productStock"
        )
        .value
    );

  const color =
    document
      .getElementById(
        "productColor"
      )
      .value
      .trim();

  const image =
    document
      .getElementById(
        "productImage"
      )
      .value
      .trim();

  const description =
    document
      .getElementById(
        "productDescription"
      )
      .value
      .trim();


  if(!name){

    message.className =
      "error";

    message.textContent =
      "Product name is required.";

    return;

  }


  if(!Number.isFinite(price) ||
     price <= 0){

    message.className =
      "error";

    message.textContent =
      "Enter a valid product price.";

    return;

  }


  if(!Number.isInteger(stock) ||
     stock < 0){

    message.className =
      "error";

    message.textContent =
      "Enter a valid stock quantity.";

    return;

  }


  message.className = "";

  message.textContent =
    "Saving product...";


  const body = {

    name,

    category,

    description,

    price,

    color,

    image,

    stock,

    active:true

  };


  const url =
    id
      ? "/api/admin/products/" +
        id
      : "/api/admin/products";


  const data =
    await api(
      url,
      {
        method:
          id
            ? "PUT"
            : "POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify(body)

      }
    );


  if(data?.error){

    message.className =
      "error";

    message.textContent =
      data.error;

    return;

  }


  message.className =
    "success";

  message.textContent =
    "Product saved successfully.";


  setTimeout(
    () => {

      closeModal();

      showProducts();

    },
    700
  );

}


/* =========================================================
   EDIT PRODUCT
========================================================= */

function editProduct(
  id
){

  const product =
    allProducts.find(
      item =>
        Number(item.id) ===
        Number(id)
    );

  if(!product){

    alert(
      "Product not found."
    );

    return;

  }

  showAddProduct(
    product
  );

}


/* =========================================================
   DELETE PRODUCT
========================================================= */

async function deleteProduct(
  id
){

  if(!confirm(
    "Delete this product from the store?"
  )){

    return;

  }


  const data =
    await api(
      "/api/admin/products/" +
      id,
      {
        method:"DELETE"
      }
    );


  if(data?.error){

    alert(
      data.error
    );

    return;

  }


  showProducts();

}
