<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#651630">

<title>Admin Dashboard | Face of Style</title>

<style>
:root{
  --wine:#651630;
  --wine2:#7d1e3b;
  --gold:#c9a45b;
  --bg:#f7f2eb;
  --line:#e6dacf;
  --text:#292025;
  --muted:#756a6f;
  --white:#fff;
  --green:#16803c;
  --red:#a32626;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  font-family:Arial,sans-serif;
  color:var(--text);
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.top{
  background:#fff;
  border-bottom:1px solid var(--line);
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:20;
}

.brand{
  font:22px Georgia;
  color:var(--wine);
}

.logout{
  background:#fff;
  border:1px solid var(--line);
  padding:9px 15px;
  border-radius:22px;
}

.layout{
  max-width:1440px;
  margin:auto;
  padding:22px 18px 50px;
}

/* =========================
   LOGIN
========================= */

.login{
  max-width:410px;
  margin:9vh auto;
  background:#fff;
  padding:32px;
  border-radius:22px;
  box-shadow:0 12px 35px #32121b16;
}

.login h1,
.panel h2{
  font-family:Georgia;
  color:var(--wine);
}

.login h1{
  font-size:31px;
  margin:0 0 8px;
}

label{
  display:block;
  font-weight:bold;
  font-size:13px;
  margin-top:4px;
}

input,
select,
textarea{
  width:100%;
  padding:12px;
  border:1px solid var(--line);
  border-radius:11px;
  margin:7px 0 14px;
  background:#fff;
  color:var(--text);
}

textarea{
  min-height:105px;
  resize:vertical;
}

.primary,
.addBtn{
  background:var(--wine);
  color:#fff;
  border:0;
  padding:12px 18px;
  border-radius:23px;
  font-weight:bold;
}

.primary:hover,
.addBtn:hover{
  background:var(--wine2);
}

.error{
  color:var(--red);
  font-size:13px;
}

.success{
  color:var(--green);
  font-size:13px;
}

.notice{
  background:#fcf8f1;
  padding:13px;
  border-radius:11px;
  color:#665d60;
  font-size:13px;
  line-height:1.6;
}

/* =========================
   STATS
========================= */

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.stat{
  background:#fff;
  border:1px solid var(--line);
  padding:18px;
  border-radius:17px;
}

.stat small{
  color:var(--muted);
}

.stat b{
  display:block;
  color:var(--wine);
  font-size:25px;
  margin-top:6px;
}

/* =========================
   TABS
========================= */

.tabs{
  display:flex;
  gap:8px;
  margin:22px 0;
  flex-wrap:wrap;
}

.tab{
  padding:10px 17px;
  border:1px solid var(--line);
  background:#fff;
  border-radius:22px;
}

.tab.active{
  background:var(--wine);
  color:#fff;
}

/* =========================
   PANELS
========================= */

.panel{
  background:#fff;
  border:1px solid var(--line);
  border-radius:19px;
  padding:20px;
  margin-bottom:20px;
}

.panelHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:15px;
}

.panel h2{
  font-size:25px;
  margin:0;
}

.search{
  max-width:360px;
}

/* =========================
   PRODUCTS
========================= */

.productGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:17px;
}

.productCard{
  border:1px solid var(--line);
  border-radius:17px;
  overflow:hidden;
  background:#fff;
}

.productImage{
  width:100%;
  height:235px;
  object-fit:cover;
  background:#f4eee7;
  display:block;
}

.noImage{
  width:100%;
  height:235px;
  background:#f4eee7;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#8b7d83;
  font-size:14px;
}

.productInfo{
  padding:15px;
}

.productInfo h3{
  margin:0 0 7px;
  color:var(--wine);
  font-family:Georgia;
}

.productMeta{
  font-size:13px;
  color:#6d6367;
  line-height:1.7;
}

.productPrice{
  font-weight:bold;
  font-size:19px;
  margin:9px 0;
  color:var(--wine);
}

.productActions{
  display:flex;
  gap:8px;
}

.productActions button{
  flex:1;
  padding:9px;
  border-radius:18px;
  border:1px solid var(--line);
  background:#fff;
}

.edit{
  background:#fff8e8!important;
}

.delete{
  color:#9a2222!important;
}

.stockIn{
  color:var(--green);
  font-weight:bold;
}

.stockOut{
  color:var(--red);
  font-weight:bold;
}

/* =========================
   FORM
========================= */

.formGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0 16px;
}

.full{
  grid-column:1/-1;
}

.uploadBox{
  border:2px dashed var(--line);
  border-radius:14px;
  padding:18px;
  text-align:center;
  background:#fcfaf7;
  margin:7px 0 14px;
}

.uploadBox input{
  display:none;
}

.uploadBtn{
  display:inline-block;
  background:var(--wine);
  color:#fff;
  padding:11px 17px;
  border-radius:22px;
  font-weight:bold;
  cursor:pointer;
}

.previewGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  margin:10px 0;
}

.previewGrid img{
  width:100%;
  height:110px;
  object-fit:cover;
  border-radius:10px;
  border:1px solid var(--line);
}

/* =========================
   TABLE
========================= */

.tableWrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:850px;
}

th,
td{
  text-align:left;
  padding:12px 10px;
  border-bottom:1px solid var(--line);
  vertical-align:top;
}

th{
  color:var(--wine);
  font-family:Georgia;
}

.pill{
  display:inline-block;
  padding:5px 9px;
  border-radius:14px;
  font-size:11px;
  font-weight:bold;
}

.paid{
  background:#e5f5ea;
  color:#176a35;
}

.pending{
  background:#fff1cf;
  color:#8a5a00;
}

.failed{
  background:#fde7e7;
  color:#9a2222;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:50;
}

.modalBox{
  background:#fff;
  width:min(700px,100%);
  max-height:92vh;
  overflow:auto;
  border-radius:20px;
  padding:22px;
}

.modalHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.close{
  border:0;
  background:#f4eee7;
  border-radius:50%;
  width:38px;
  height:38px;
  font-size:20px;
}

.loading{
  padding:20px;
  text-align:center;
  color:var(--muted);
}

.empty{
  text-align:center;
  padding:30px;
  color:var(--muted);
}

/* =========================
   MOBILE
========================= */

@media(max-width:1000px){

  .cards{
    grid-template-columns:1fr 1fr;
  }

  .productGrid{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:650px){

  .cards,
  .productGrid,
  .formGrid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .top{
    padding:12px 14px;
  }

  .brand{
    font-size:18px;
  }

  .layout{
    padding:16px 11px 40px;
  }

  .panel{
    padding:15px;
  }

  .panelHead{
    align-items:stretch;
    flex-direction:column;
  }

  .search{
    max-width:none;
  }

  .previewGrid{
    grid-template-columns:repeat(2,1fr);
  }

}

</style>
</head>

<body>

<div class="top">

  <b class="brand">
    FACE OF STYLE — ADMIN
  </b>

  <button
    class="logout"
    onclick="logout()"
  >
    Logout
  </button>

</div>

<div id="app"></div>


<script>

/* =========================================================
   GLOBAL
========================================================= */

const app =
  document.getElementById("app");

let token =
  sessionStorage.getItem("adminToken") || "";

let allProducts = [];

let selectedImages = [];


/* =========================================================
   HELPERS
========================================================= */

function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function money(value){

  const number =
    Number(value || 0);

  return "₦" +
    number.toLocaleString("en-NG");

}


/* =========================================================
   IMAGE FALLBACK
========================================================= */

function productImage(product){

  if(product && product.image){

    return product.image;

  }

  const id =
    Number(product?.id || 1);

  return `/assets/product-${id}.jpg`;

}


/* =========================================================
   LOGIN
========================================================= */

function login(){

  app.innerHTML = `

    <div class="login">

      <h1>
        Admin Login
      </h1>

      <p>
        Face of Style Hijab Factory
      </p>

      <label>
        Username
      </label>

      <input
        id="username"
        value="admin"
        autocomplete="username"
      >

      <label>
        Password
      </label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
      >

      <button
        class="primary"
        style="width:100%"
        onclick="doLogin()"
      >
        LOGIN
      </button>

      <p
        id="loginError"
        class="error"
      ></p>

    </div>

  `;

}


/* =========================================================
   LOGIN ACTION
========================================================= */

async function doLogin(){

  const error =
    document.getElementById("loginError");

  error.textContent = "";

  try{

    const response =
      await fetch(
        "/api/admin/login",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            username:
              document
                .getElementById("username")
                .value
                .trim(),

            password:
              document
                .getElementById("password")
                .value

          })

        }
      );

    const data =
      await response.json();

    if(data.token){

      token =
        data.token;

      sessionStorage.setItem(
        "adminToken",
        token
      );

      dashboard();

    }else{

      error.textContent =
        data.message ||
        "Login failed.";

    }

  }catch(errorObject){

    console.error(errorObject);

    error.textContent =
      "Unable to connect to server.";

  }

}


/* =========================================================
   LOGOUT
========================================================= */

function logout(){

  sessionStorage.removeItem(
    "adminToken"
  );

  token = "";

  login();

}


/* =========================================================
   API HELPER
========================================================= */

async function api(
  url,
  options={}
){

  options.headers = {

    ...(options.headers || {}),

    Authorization:
      "Bearer " + token

  };

  try{

    const response =
      await fetch(
        url,
        options
      );

    if(response.status === 401){

      logout();

      return null;

    }

    const text =
      await response.text();

    try{

      return JSON.parse(text);

    }catch{

      return {

        error:
          text ||
          "Server returned invalid response."

      };

    }

  }catch(error){

    console.error(error);

    return {

      error:
        "Unable to connect to server."

    };

  }

}


/* =========================================================
   DASHBOARD
========================================================= */

async function dashboard(){

  const data =
    await api(
      "/api/admin/dashboard"
    );

  if(!data) return;

  const stats =
    data.stats || {};

  app.innerHTML = `

    <div class="layout">

      <div class="cards">

        <div class="stat">

          <small>
            Total Orders
          </small>

          <b>
            ${stats.orders || 0}
          </b>

        </div>


        <div class="stat">

          <small>
            Paid Orders
          </small>

          <b>
            ${stats.paid || 0}
          </b>

        </div>


        <div class="stat">

          <small>
            Pending Orders
          </small>

          <b>
            ${stats.pending || 0}
          </b>

        </div>


        <div class="stat">

          <small>
            Revenue
          </small>

          <b>
            ${money(stats.revenue)}
          </b>

        </div>

      </div>


      <div class="tabs">

        <button
          id="tabOrders"
          class="tab active"
          onclick="showOrders()"
        >
          Orders
        </button>


        <button
          id="tabProducts"
          class="tab"
          onclick="showProducts()"
        >
          Products
        </button>


        <button
          id="tabSettings"
          class="tab"
          onclick="showSettings()"
        >
          Settings
        </button>

      </div>


      <div id="content"></div>

    </div>

  `;

  showOrders();

}


/* =========================================================
   ACTIVE TAB
========================================================= */

function activeTab(id){

  document
    .querySelectorAll(".tab")
    .forEach(
      element =>
        element.classList.remove(
          "active"
        )
    );

  const element =
    document.getElementById(id);

  if(element){

    element.classList.add(
      "active"
    );

  }

}


/* =========================================================
   ORDERS
========================================================= */

async function showOrders(){

  activeTab("tabOrders");

  const content =
    document.getElementById(
      "content"
    );

  content.innerHTML = `

    <div class="panel">

      <h2>
        Orders
      </h2>

      <div class="loading">
        Loading orders...
      </div>

    </div>

  `;

  const data =
    await api(
      "/api/admin/orders"
    );

  if(!data) return;

  const orders =
    Array.isArray(data)
      ? data
      : (data.orders || []);

  content.innerHTML = `

    <div class="panel">

      <div class="panelHead">

        <h2>
          Customer Orders
        </h2>

        <button
          class="addBtn"
          onclick="showOrders()"
        >
          Refresh
        </button>

      </div>

      ${
        orders.length

        ?

        `

        <div class="tableWrap">

          <table>

            <thead>

              <tr>

                <th>
                  Reference
                </th>

                <th>
                  Customer
                </th>

                <th>
                  Phone
                </th>

                <th>
                  Total
                </th>

                <th>
                  Payment
                </th>

                <th>
                  Status
                </th>

                <th>
                  Date
                </th>

              </tr>

            </thead>


            <tbody>

              ${
                orders.map(order => {

                  const paymentStatus =
                    String(
                      order.payment_status ||
                      "pending"
                    ).toLowerCase();

                  const className =
                    paymentStatus === "paid"
                      ? "paid"
                      : paymentStatus === "failed"
                        ? "failed"
                        : "pending";

                  return `

                    <tr>

                      <td>
                        ${esc(
                          order.reference || "-"
                        )}
                      </td>

                      <td>
                        ${esc(
                          order.customer_name || "-"
                        )}
                      </td>

                      <td>
                        ${esc(
                          order.customer_phone || "-"
                        )}
                      </td>

                      <td>
                        ${money(order.total)}
                      </td>

                      <td>
                        ${esc(
                          order.payment_method || "-"
                        )}
                      </td>

                      <td>

                        <span
                          class="pill ${className}"
                        >
                          ${esc(
                            order.payment_status ||
                            "PENDING"
                          )}
                        </span>

                      </td>

                      <td>
                        ${
                          order.created_at
                            ? new Date(
                                order.created_at
                              ).toLocaleString(
                                "en-NG"
                              )
                            : "-"
                        }
                      </td>

                    </tr>

                  `;

                }).join("")

              }

            </tbody>

          </table>

        </div>

        `

        :

        `

        <div class="empty">

          No orders found.

        </div>

        `

      }

    </div>

  `;

}


/* =========================================================
   PRODUCTS
========================================================= */

async function showProducts(){

  activeTab("tabProducts");

  const content =
    document.getElementById(
      "content"
    );

  content.innerHTML = `

    <div class="panel">

      <h2>
        Products
      </h2>

      <div class="loading">
        Loading products...
      </div>

    </div>

  `;

  const data =
    await api(
      "/api/admin/products"
    );

  if(!data) return;

  allProducts =
    Array.isArray(data)
      ? data
      : (data.products || []);

  renderProducts(
    allProducts
  );

}


/* =========================================================
   RENDER PRODUCTS
========================================================= */

function renderProducts(products){

  const content =
    document.getElementById(
      "content"
    );

  content.innerHTML = `

    <div class="panel">

      <div class="panelHead">

        <h2>
          Products
        </h2>

        <button
          class="addBtn"
          onclick="showAddProduct()"
        >
          + Add Product
        </button>

      </div>


      <input
        class="search"
        id="productSearch"
        placeholder="Search products..."
        oninput="filterProducts(this.value)"
      >


      <div
        id="productsList"
        class="productGrid"
        style="margin-top:15px"
      ></div>

    </div>

  `;

  drawProductCards(
    products
  );

}


/* =========================================================
   SEARCH
========================================================= */

function filterProducts(value){

  const query =
    String(value || "")
      .toLowerCase()
      .trim();

  const filtered =
    allProducts.filter(
      product => {

        const name =
          String(
            product.name || ""
          ).toLowerCase();

        const category =
          String(
            product.category ||
            product.cat ||
            ""
          ).toLowerCase();

        return (
          name.includes(query) ||
          category.includes(query)
        );

      }
    );

  drawProductCards(
    filtered
  );

}


/* =========================================================
   PRODUCT CARDS
========================================================= */

function drawProductCards(
  products
){

  const list =
    document.getElementById(
      "productsList"
    );

  if(!list) return;

  if(!products.length){

    list.innerHTML = `

      <div
        class="empty"
        style="grid-column:1/-1"
      >
        No products found.
      </div>

    `;

    return;

  }


  list.innerHTML =
    products.map(
      product => {

        const stock =
          Number(
            product.stock ?? 0
          );

        const image =
          productImage(
            product
          );

        const stockClass =
          stock > 0
            ? "stockIn"
            : "stockOut";

        const stockText =
          stock > 0
            ? `${stock} in stock`
            : "Out of Stock";

        return `

          <div class="productCard">

            <img
              class="productImage"
              src="${esc(image)}"
              alt="${esc(
                product.name ||
                "Product"
              )}"
              onerror="
                this.onerror=null;
                this.style.display='none';
                this.nextElementSibling.style.display='flex';
              "
            >

            <div
              class="noImage"
              style="display:none"
            >
              No Image
            </div>


            <div class="productInfo">

              <h3>
                ${esc(
                  product.name ||
                  "Unnamed Product"
                )}
              </h3>


              <div class="productMeta">

                Category:
                ${esc(
                  product.category ||
                  product.cat ||
                  "Fashion"
                )}

                <br>

                Color:
                ${esc(
                  product.color ||
                  "-"
                )}

                <br>

                Stock:
                <span
                  class="${stockClass}"
                >
                  ${stockText}
                </span>

              </div>


              <div class="productPrice">

                ${money(
                  product.price
                )}

              </div>


              <div class="productActions">

                <button
                  class="edit"
                  onclick="editProduct(${Number(product.id)})"
                >
                  Edit
                </button>

                <button
                  class="delete"
                  onclick="deleteProduct(${Number(product.id)})"
                >
                  Delete
                </button>

              </div>

            </div>

          </div>

        `;

      }
    ).join("");

}


/* =========================================================
   ADD / EDIT PRODUCT
========================================================= */

function showAddProduct(
  product=null
){

  const editing =
    !!product;

  selectedImages = [];


  document.body.insertAdjacentHTML(
    "beforeend",

    `

    <div
      class="modal"
      id="productModal"
    >

      <div class="modalBox">

        <div class="modalHead">

          <h2>
            ${
              editing
                ? "Edit Product"
                : "Add Product"
            }
          </h2>

          <button
            class="close"
            onclick="closeModal()"
          >
            ×
          </button>

        </div>


        <div class="formGrid">


          <div>

            <label>
              Product Name
            </label>

            <input
              id="productName"
              value="${esc(
                product?.name || ""
              )}"
              placeholder="Elegant Zip Abaya"
            >

          </div>


          <div>

            <label>
              Category
            </label>

            <select
              id="productCategory"
            >

              ${
                [
                  "Hijab",
                  "Abaya",
                  "Gown",
                  "Caps",
                  "Modest Outfit",
                  "Accessories",
                  "Custom",
                  "Fashion"
                ]
                .map(
                  category => `

                    <option
                      value="${esc(category)}"
                      ${
                        category ===
                        (
                          product?.category ||
                          product?.cat ||
                          "Fashion"
                        )
                          ? "selected"
                          : ""
                      }
                    >
                      ${esc(category)}
                    </option>

                  `
                )
                .join("")
              }

            </select>

          </div>


          <div>

            <label>
              Price (₦)
            </label>

            <input
              id="productPrice"
              type="number"
              min="0"

              type="number"
              min="0"
              max="100"
              value="${Number(
                product?.discount || 0

            >

          </div>


          <div>

            <label>
              Color
            </label>

            <input
              id="productColor"
              value="${esc(
                product?.color || ""
              )}"
              placeholder="Wine"
            >

          </div>


          <div>

            <label>
              Stock
            </label>

            <input
              id="productStock"
              type="number"
              min="0"
              value="${Number(
                product?.stock ?? 0
              )}"
            >

          </div>


          <div>

            <label>
              Sizes
            </label>

            <input
              id="productSizes"
              value="${esc(
                product?.sizes || ""
              )}"
              placeholder="S, M, L, XL"
            >

          </div>


          <div>

            <label>
              Image URL
            </label>

            <input
              id="productImage"
              value="${esc(
                product?.image || ""
              )}"
              placeholder="/assets/product-1.jpg"
            >

          </div>


          <div class="full">

            <label>
              Product Photo
            </label>


            <div class="uploadBox">

              <label
                for="galleryInput"
                class="uploadBtn"
              >
                📷 Choose from Gallery
              </label>

              <input
                id="galleryInput"
                type="file"
                accept="image/*"
                onchange="handleImage(this)"
              >

              <p
                style="
                  margin:9px 0 0;
                  color:#756a6f;
                  font-size:12px
                "
              >
                Select one product image.
              </p>

            </div>


            <div
              id="previewGrid"
              class="previewGrid"
            >

              ${
                product?.image
                  ?

                  `<img
                    src="${esc(product.image)}"
                    alt="Current product image"
                  >`

                  :

                  ""
              }

            </div>

          </div>


          <div class="full">

            <label>
              Description
            </label>

            <textarea
              id="productDescription"
              placeholder="Describe the product..."
            >${esc(
              product?.description ||
              product?.desc ||
              ""
            )}</textarea>

          </div>


        </div>


        <button
          class="primary"
          style="width:100%"
          onclick="saveProduct(${
            editing
              ? Number(product.id)
              : "null"
          })"
        >
          ${
            editing
              ? "UPDATE PRODUCT"
              : "SAVE PRODUCT"
          }
        </button>


        <p
          id="productMessage"
        ></p>


      </div>

    </div>

    `

  );

}


/* =========================================================
   IMAGE COMPRESSION
========================================================= */

function compressImage(
  file
){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();

      reader.onload =
        event => {

          const img =
            new Image();

          img.onload =
            () => {

              const maxWidth =
                1200;

              let width =
                img.width;

              let height =
                img.height;


              if(width > maxWidth){

                height =
                  Math.round(
                    height *
                    maxWidth /
                    width
                  );

                width =
                  maxWidth;

              }


              const canvas =
                document.createElement(
                  "canvas"
                );

              canvas.width =
                width;

              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  "2d"
                );

              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              canvas.toBlob(
                blob => {

                  if(!blob){

                    reject(
                      new Error(
                        "Image compression failed."
                      )
                    );

                    return;

                  }


                  const compressedReader =
                    new FileReader();

                  compressedReader.onload =
                    () => {

                      resolve(
                        compressedReader.result
                      );

                    };

                  compressedReader.onerror =
                    reject;

                  compressedReader.readAsDataURL(
                    blob
                  );

                },

                "image/jpeg",

                0.78
              );

            };


          img.onerror =
            reject;

          img.src =
            event.target.result;

        };


      reader.onerror =
        reject;

      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================================================
   SELECT IMAGE
========================================================= */

async function handleImage(
  input
){

  const file =
    input.files?.[0];

  if(!file) return;


  const message =
    document.getElementById(
      "productMessage"
    );

  if(message){

    message.className = "";

    message.textContent =
      "Preparing image...";

  }


  try{

    const image =
      await compressImage(
        file
      );

    selectedImages =
      [image];


    const grid =
      document.getElementById(
        "previewGrid"
      );

    if(grid){

      grid.innerHTML = `

        <img
          src="${image}"
          alt="New product image"
        >

      `;

    }


    if(message){

      message.textContent =
        "Image ready.";

    }

  }catch(error){

    console.error(error);

    if(message){

      message.className =
        "error";

      message.textContent =
        "Unable to process image.";

    }

  }

}


/* =========================================================
   CLOSE MODAL
========================================================= */

function closeModal(){

  const modal =
    document.getElementById(
      "productModal"
    );

  if(modal){

    modal.remove();

  }

  selectedImages = [];

}


/* =========================================================
   SAVE PRODUCT
========================================================= */

async function saveProduct(
  id
){

  const message =
    document.getElementById(
      "productMessage"
    );


  const name =
    document
      .getElementById(
        "productName"
      )
      .value
      .trim();


  const category =
    document.getElementById(
      "productCategory"
    ).value;


  const price =
    Number(
      document.getElementById(
        "productPrice"
      ).value
    );


  const discount =
    Number(
      document.getElementById(
        "productDiscount"
      ).value || 0
    );


  const color =
    document
      .getElementById(
        "productColor"
      )
      .value
      .trim();


  const stock =
    Number(
      document.getElementById(
        "productStock"
      ).value || 0
    );


  const sizes =
    document
      .getElementById(
        "productSizes"
      )
      .value
      .trim();


  const imageInput =
    document
      .getElementById(
        "productImage"
      )
      .value
      .trim();


  const description =
    document
      .getElementById(
        "productDescription"
      )
      .value
      .trim();


  if(!name){

    message.className =
      "error";

    message.textContent =
      "Product name is required.";

    return;

  }


  if(!Number.isFinite(price) ||
     price <= 0){

    message.className =
      "error";

    message.textContent =
      "A valid product price is required.";

    return;

  }


  if(
    !Number.isInteger(stock) ||
    stock < 0 ||
    stock > 1000000
  ){

    message.className =
      "error";

    message.textContent =
      "Stock must be a valid number between 0 and 1,000,000.";

    return;

  }


  if(
    !Number.isFinite(discount) ||
    discount < 0 ||
    discount > 100
  ){

    message.className =
      "error";

    message.textContent =
      "Discount must be between 0 and 100.";

    return;

  }


  /*
    IMPORTANT:

    If editing and no new image
    was selected, keep the existing
    image URL/base64 value.

    If a new image was selected,
    use the compressed image.
  */

  let finalImage =
    imageInput;


  if(selectedImages.length){

    finalImage =
      selectedImages[0];

  }


  const data = {

    name,

    category,

    description,

    price,

    color,

    image:
      finalImage,

    stock,

    active:true

  };


  message.className = "";

  message.textContent =
    "Saving product...";


  const url =
    id
      ? `/api/admin/products/${id}`
      : "/api/admin/products";


  const response =
    await api(
      url,
      {

        method:
          id
            ? "PUT"
            : "POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify(
            data
          )

      }
    );


  if(
    response &&
    !response.error &&
    response.ok !== false
  ){

    message.className =
      "success";

    message.textContent =
      id
        ? "Product updated successfully."
        : "Product created successfully.";


    setTimeout(
      () => {

        closeModal();

        showProducts();

      },
      700
    );


  }else{

    message.className =
      "error";

    message.textContent =
      response?.message ||
      response?.error ||
      "Unable to save product.";

  }

}


/* =========================================================
   EDIT PRODUCT
========================================================= */

function editProduct(
  id
){

  const product =
    allProducts.find(
      item =>
        Number(item.id) ===
        Number(id)
    );


  if(!product){

    alert(
      "Product was not found."
    );

    return;

  }


  showAddProduct(
    product
  );

}


/* =========================================================
   DELETE PRODUCT
========================================================= */

async function deleteProduct(
  id
){

  const confirmed =
    confirm(
      "Delete this product?"
    );


  if(!confirmed){

    return;

  }


  const response =
    await api(
      `/api/admin/products/${id}`,
      {
        method:"DELETE"
      }
    );


  if(
    response &&
    !response.error &&
    response.ok !== false
  ){

    showProducts();

  }else{

    alert(
      response?.message ||
      response?.error ||
      "Unable to delete product."
    );

  }

}
