<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#651630">

<title>Admin Dashboard | Face of Style Hijab Factory</title>

<style>

:root{
  --wine:#651630;
  --wine2:#4d1024;
  --gold:#c9a45b;
  --bg:#f7f2eb;
  --line:#e6dacf;
  --text:#292025;
  --muted:#756a6f;
  --white:#fff;
  --green:#16803c;
  --red:#a32626;
  --orange:#8a5a00;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.top{
  background:#fff;
  border-bottom:1px solid var(--line);
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:100;
}

.brand{
  margin:0;
  color:var(--wine);
  font:22px Georgia,serif;
}

.logout{
  background:#fff;
  border:1px solid var(--line);
  padding:9px 16px;
  border-radius:22px;
  color:var(--wine);
  font-weight:bold;
}

.logout:hover{
  background:#f8f1eb;
}

.layout{
  width:100%;
  max-width:1450px;
  margin:auto;
  padding:22px 18px 60px;
}

.login{
  width:min(410px,calc(100% - 24px));
  margin:10vh auto;
  background:#fff;
  padding:32px;
  border-radius:22px;
  box-shadow:0 12px 35px #32121b18;
}

.login h1{
  margin:0 0 8px;
  color:var(--wine);
  font:32px Georgia,serif;
}

.login p{
  color:var(--muted);
}

label{
  display:block;
  font-weight:bold;
  font-size:13px;
  margin-top:7px;
}

input,
select,
textarea{
  width:100%;
  padding:12px;
  border:1px solid var(--line);
  border-radius:11px;
  margin:7px 0 14px;
  background:#fff;
  color:var(--text);
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--gold);
}

textarea{
  min-height:110px;
  resize:vertical;
}

.primary,
.addBtn{
  background:var(--wine);
  color:#fff;
  border:0;
  padding:12px 18px;
  border-radius:23px;
  font-weight:bold;
}

.primary:hover,
.addBtn:hover{
  background:var(--wine2);
}

.error{
  color:var(--red)!important;
  font-size:13px;
}

.success{
  color:var(--green)!important;
  font-size:13px;
}

.notice{
  background:#fcf8f1;
  padding:13px;
  border-radius:11px;
  color:#665d60;
  font-size:13px;
  line-height:1.6;
  margin-bottom:15px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:14px;
}

.stat{
  background:#fff;
  border:1px solid var(--line);
  padding:18px;
  border-radius:17px;
}

.stat small{
  color:var(--muted);
  display:block;
}

.stat b{
  display:block;
  color:var(--wine);
  font-size:25px;
  margin-top:6px;
}

.tabs{
  display:flex;
  gap:8px;
  margin:22px 0;
  flex-wrap:wrap;
}

.tab{
  padding:10px 18px;
  border:1px solid var(--line);
  background:#fff;
  border-radius:22px;
  color:var(--text);
}

.tab.active{
  background:var(--wine);
  color:#fff;
  border-color:var(--wine);
}

.panel{
  background:#fff;
  border:1px solid var(--line);
  border-radius:19px;
  padding:20px;
  margin-bottom:20px;
}

.panelHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:15px;
}

.panel h2{
  margin:0;
  color:var(--wine);
  font:25px Georgia,serif;
}

.search{
  max-width:380px;
}

.productGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:17px;
  margin-top:16px;
}

.productCard{
  border:1px solid var(--line);
  border-radius:17px;
  overflow:hidden;
  background:#fff;
}

.productImage{
  width:100%;
  height:235px;
  object-fit:cover;
  background:#f4eee7;
  display:block;
}

.noImage{
  width:100%;
  height:235px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f4eee7;
  color:var(--muted);
}

.productInfo{
  padding:15px;
}

.productInfo h3{
  margin:0 0 8px;
  color:var(--wine);
  font:20px Georgia,serif;
}

.productMeta{
  font-size:13px;
  color:#6d6367;
  line-height:1.7;
}

.productPrice{
  color:var(--wine);
  font-size:19px;
  font-weight:bold;
  margin:9px 0;
}

.productActions{
  display:flex;
  gap:8px;
}

.productActions button{
  flex:1;
  padding:9px;
  border-radius:18px;
  border:1px solid var(--line);
  background:#fff;
}

.edit{
  background:#fff8e8!important;
}

.delete{
  color:#9a2222!important;
}

.formGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0 16px;
}

.full{
  grid-column:1/-1;
}

.imageHelp{
  background:#fcf8f1;
  padding:12px;
  border-radius:11px;
  font-size:12px;
  color:var(--muted);
  line-height:1.6;
  margin-bottom:12px;
}

.preview{
  width:100%;
  max-height:250px;
  object-fit:contain;
  background:#f4eee7;
  border-radius:12px;
  margin:5px 0 14px;
}

.tableWrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1150px;
}

th,
td{
  text-align:left;
  padding:12px 10px;
  border-bottom:1px solid var(--line);
  vertical-align:top;
}

th{
  color:var(--wine);
  font-family:Georgia,serif;
}

td small{
  color:var(--muted);
}

.pill{
  display:inline-block;
  padding:5px 9px;
  border-radius:14px;
  font-size:11px;
  font-weight:bold;
}

.paid{
  background:#e5f5ea;
  color:#176a35;
}

.pending{
  background:#fff1cf;
  color:#8a5a00;
}

.failed,
.cancelled{
  background:#fde7e7;
  color:#9a2222;
}

.refunded{
  background:#eee6fb;
  color:#63349a;
}

.processing{
  background:#fff1cf;
  color:#8a5a00;
}

.shipped{
  background:#e6f6f6;
  color:#176b6b;
}

.delivered{
  background:#e5f5ea;
  color:#176a35;
}

.statusSelect,
.paymentSelect{
  min-width:135px;
  margin:6px 0 0;
}

.empty{
  text-align:center;
  padding:35px;
  color:var(--muted);
}

.loading{
  padding:25px;
  text-align:center;
  color:var(--muted);
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:500;
}

.modalBox{
  width:min(760px,100%);
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:20px;
  padding:22px;
}

.modalHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:15px;
}

.modalHead h2{
  margin:0;
  color:var(--wine);
  font:25px Georgia,serif;
}

.close{
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#f4eee7;
  font-size:21px;
}

.close:hover{
  background:#eadfd5;
}

.infoGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.infoBox{
  background:#fcf8f1;
  padding:13px;
  border-radius:12px;
}

.infoBox small{
  display:block;
  color:var(--muted);
  margin-bottom:5px;
}

.refreshBtn{
  border:1px solid var(--line);
  background:#fff;
  padding:10px 15px;
  border-radius:20px;
  color:var(--wine);
  font-weight:bold;
}

.refreshBtn:hover{
  background:#f8f1eb;
}

@media(max-width:1150px){

  .cards{
    grid-template-columns:repeat(3,1fr);
  }

  .productGrid{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:700px){

  .top{
    padding:12px 14px;
  }

  .brand{
    font-size:17px;
  }

  .layout{
    padding:15px 11px 40px;
  }

  .cards{
    grid-template-columns:1fr 1fr;
  }

  .productGrid{
    grid-template-columns:1fr;
  }

  .formGrid,
  .infoGrid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .panel{
    padding:15px;
  }

  .panelHead{
    align-items:stretch;
    flex-direction:column;
  }

  .search{
    max-width:none;
  }

  .login{
    padding:25px;
  }

}

@media(max-width:430px){

  .cards{
    grid-template-columns:1fr;
  }

  .tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .tab{
    width:100%;
  }

}

</style>
</head>

<body>

<div class="top">

  <b class="brand">
    FACE OF STYLE — ADMIN
  </b>

  <button
    class="logout"
    onclick="logout()"
  >
    Logout
  </button>

</div>

<div id="app"></div>


<script>

/* =========================================================
   GLOBAL STATE
========================================================= */

const app =
  document.getElementById("app");

let token =
  sessionStorage.getItem("adminToken") || "";

let allProducts = [];

let allOrders = [];

let selectedImage = "";


/* =========================================================
   HELPERS
========================================================= */

function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function money(value){

  return "₦" +
    Number(value || 0)
      .toLocaleString("en-NG");

}


function normalizeImage(value){

  let image =
    String(value || "").trim();

  if(!image){
    return "";
  }

  if(
    /^https?:\/\//i.test(image) ||
    /^data:image\//i.test(image)
  ){
    return image;
  }

  image =
    image.replace(/\\/g,"/");

  image =
    image.replace(/^\/+/,"");

  if(
    image.startsWith("assets/")
  ){
    return "/" + image;
  }

  return "/assets/" + image;

}


function statusClass(status){

  return String(status || "")
    .toLowerCase()
    .replace(/[^a-z]/g,"");

}


function formatDate(value){

  if(!value){
    return "-";
  }

  const date =
    new Date(value);

  if(
    Number.isNaN(
      date.getTime()
    )
  ){
    return "-";
  }

  return date.toLocaleString(
    "en-NG"
  );

}


/* =========================================================
   LOGIN
========================================================= */

function login(){

  app.innerHTML = `

    <div class="login">

      <h1>
        Admin Login
      </h1>

      <p>
        Face of Style Hijab Factory
      </p>

      <label>
        Username
      </label>

      <input
        id="username"
        value="admin"
        autocomplete="username"
        placeholder="Admin username"
      >

      <label>
        Password
      </label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Admin password"
        onkeydown="
          if(event.key==='Enter'){
            doLogin();
          }
        "
      >

      <button
        class="primary"
        style="width:100%"
        onclick="doLogin()"
      >
        LOGIN
      </button>

      <p
        id="loginError"
        class="error"
      ></p>

      <div class="notice">
        Use the ADMIN_USERNAME and ADMIN_PASSWORD
        values configured in Render.
      </div>

    </div>

  `;

}


async function doLogin(){

  const error =
    document.getElementById(
      "loginError"
    );

  error.textContent = "";

  const username =
    document
      .getElementById("username")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  if(!username || !password){

    error.textContent =
      "Enter username and password.";

    return;

  }

  try{

    const response =
      await fetch(
        "/api/admin/login",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              username,
              password
            })
        }
      );

    const data =
      await response.json();

    if(
      response.ok &&
      data.ok &&
      data.token
    ){

      token =
        data.token;

      sessionStorage.setItem(
        "adminToken",
        token
      );

      await dashboard();

      return;

    }

    error.textContent =
      data.message ||
      "Invalid admin credentials.";

  }catch(errorObject){

    console.error(
      errorObject
    );

    error.textContent =
      "Unable to connect to server.";

  }

}


/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

  const oldToken =
    token;

  token = "";

  sessionStorage.removeItem(
    "adminToken"
  );

  if(oldToken){

    try{

      await fetch(
        "/api/admin/logout",
        {
          method:"POST",

          headers:{
            Authorization:
              "Bearer " +
              oldToken
          }
        }
      );

    }catch{}

  }

  login();

}


/* =========================================================
   API HELPER
========================================================= */

async function api(
  url,
  options={}
){

  if(!token){

    login();

    return null;

  }

  const headers = {
    ...(options.headers || {}),
    Authorization:
      "Bearer " + token
  };

  try{

    const response =
      await fetch(
        url,
        {
          ...options,
          headers
        }
      );

    if(
      response.status === 401
    ){

      sessionStorage.removeItem(
        "adminToken"
      );

      token = "";

      login();

      return null;

    }

    const text =
      await response.text();

    let data = {};

    try{

      data =
        text
          ? JSON.parse(text)
          : {};

    }catch{

      data = {
        error:
          text ||
          "Invalid server response."
      };

    }

    if(
      !response.ok &&
      !data.error
    ){

      data.error =
        data.message ||
        "Request failed.";

    }

    return data;

  }catch(errorObject){

    console.error(
      errorObject
    );

    return {
      error:
        "Unable to connect to server."
    };

  }

}


/* =========================================================
   DASHBOARD
========================================================= */

async function dashboard(){

  const ordersData =
    await api(
      "/api/admin/orders"
    );

  const productsData =
    await api(
      "/api/admin/products"
    );

  if(
    !ordersData ||
    !productsData
  ){
    return;
  }

  allOrders =
    Array.isArray(
      ordersData.orders
    )
      ? ordersData.orders
      : [];

  allProducts =
    Array.isArray(
      productsData.products
    )
      ? productsData.products
      : [];

  renderDashboard();

}


function renderDashboard(){

  const paidOrders =
    allOrders.filter(
      order =>
        String(
          order.payment_status || ""
        ).toUpperCase() === "PAID"
    );

  const pendingOrders =
    allOrders.filter(
      order =>
        String(
          order.payment_status || ""
        ).toUpperCase() === "PENDING"
    );

  const processingOrders =
    allOrders.filter(
      order =>
        String(
          order.order_status || ""
        ).toUpperCase() === "PROCESSING"
    );

  const revenue =
    paidOrders.reduce(
      (
        total,
        order
      ) =>
        total +
        Number(
          order.total || 0
        ),
      0
    );

  app.innerHTML = `

    <div class="layout">

      <div class="cards">

        <div class="stat">
          <small>Total Orders</small>
          <b>${allOrders.length}</b>
        </div>

        <div class="stat">
          <small>Paid Orders</small>
          <b>${paidOrders.length}</b>
        </div>

        <div class="stat">
          <small>Pending Payments</small>
          <b>${pendingOrders.length}</b>
        </div>

        <div class="stat">
          <small>Processing</small>
          <b>${processingOrders.length}</b>
        </div>

        <div class="stat">
          <small>Revenue</small>
          <b>${money(revenue)}</b>
        </div>

      </div>


      <div class="tabs">

        <button
          id="tabOrders"
          class="tab active"
          onclick="showOrders()"
        >
          Orders
        </button>

        <button
          id="tabProducts"
          class="tab"
          onclick="showProducts()"
        >
          Products
        </button>

      </div>


      <div id="content"></div>

    </div>

  `;

  showOrders();

}


/* =========================================================
   TAB
========================================================= */

function activeTab(id){

  document
    .querySelectorAll(".tab")
    .forEach(
      button =>
        button.classList.remove(
          "active"
        )
    );

  const element =
    document.getElementById(id);

  if(element){

    element.classList.add(
      "active"
    );

  }

}


/* =========================================================
   ORDERS
========================================================= */

async function showOrders(){

  activeTab("tabOrders");

  const content =
    document.getElementById(
      "content"
    );

  if(!content){
    return;
  }

  content.innerHTML = `

    <div class="panel">

      <div class="panelHead">

        <h2>
          Customer Orders
        </h2>

        <button
          class="refreshBtn"
          onclick="showOrders()"
        >
          Refresh
        </button>

      </div>

      <div class="loading">
        Loading orders...
      </div>

    </div>

  `;

  const data =
    await api(
      "/api/admin/orders"
    );

  if(!data){
    return;
  }

  if(data.error){

    content.innerHTML = `

      <div class="panel">

        <h2>
          Customer Orders
        </h2>

        <p class="error">
          ${esc(data.error)}
        </p>

      </div>

    `;

    return;

  }

  allOrders =
    Array.isArray(
      data.orders
    )
      ? data.orders
      : [];

  renderOrders(
    allOrders
  );

}


function renderOrders(
  orders
){

  const content =
    document.getElementById(
      "content"
    );

  if(!content){
    return;
  }

  content.innerHTML = `

    <div class="panel">

      <div class="panelHead">

        <h2>
          Customer Orders
        </h2>

        <button
          class="refreshBtn"
          onclick="showOrders()"
        >
          Refresh
        </button>

      </div>

      <div class="notice">

        <b>Payment:</b>
        Paystack verification normally controls payment status.

        <br>

        <b>Order:</b>
        Use Order Status to manage the delivery workflow.

      </div>

      ${
        orders.length

          ? `

            <div class="tableWrap">

              <table>

                <thead>

                  <tr>

                    <th>
                      Reference
                    </th>

                    <th>
                      Customer
                    </th>

                    <th>
                      Address
                    </th>

                    <th>
                      Items
                    </th>

                    <th>
                      Total
                    </th>

                    <th>
                      Payment
                    </th>

                    <th>
                      Order Status
                    </th>

                    <th>
                      Date
                    </th>

                  </tr>

                </thead>

                <tbody>

                  ${
                    orders
                      .map(
                        order => {

                          const payment =
                            String(
                              order.payment_status ||
                              "PENDING"
                            ).toUpperCase();

                          const orderStatus =
                            String(
                              order.order_status ||
                              "PENDING"
                            ).toUpperCase();

                          const items =
                            Array.isArray(
                              order.items
                            )
                              ? order.items
                              : [];

                          return `

                            <tr>

                              <td>

                                <b>
                                  ${esc(
                                    order.reference ||
                                    "-"
                                  )}
                                </b>

                                ${
                                  order.paystack_reference

                                    ? `

                                      <br>

                                      <small>
                                        Paystack:
                                        ${esc(
                                          order.paystack_reference
                                        )}
                                      </small>

                                    `

                                    : ""
                                }

                              </td>


                              <td>

                                <b>
                                  ${esc(
                                    order.customer_name ||
                                    "-"
                                  )}
                                </b>

                                <br>

                                <small>
                                  ${esc(
                                    order.customer_phone ||
                                    "-"
                                  )}
                                </small>

                                <br>

                                <small>
                                  ${esc(
                                    order.customer_email ||
                                    "-"
                                  )}
                                </small>

                              </td>


                              <td>
                                ${esc(
                                  order.delivery_address ||
                                  "-"
                                )}
                              </td>


                              <td>

                                ${
                                  items.length

                                    ? items
                                      .map(
                                        item => `

                                          <div
                                            style="
                                              margin-bottom:8px;
                                            "
                                          >

                                            <b>
                                              ${esc(
                                                item.product_name ||
                                                "Product"
                                              )}
                                            </b>

                                            ×
                                            ${Number(
                                              item.quantity || 0
                                            )}

                                            <br>

                                            <small>
                                              ${money(
                                                item.subtotal
                                              )}
                                            </small>

                                          </div>

                                        `
                                      )
                                      .join("")

                                    : "-"
                                }

                              </td>


                              <td>

                                <b>
                                  ${money(
                                    order.total
                                  )}
                                </b>

                              </td>


                              <td>

                                <span
                                  class="pill ${
                                    payment === "PAID"
                                      ? "paid"
                                      : payment === "FAILED"
                                        ? "failed"
                                        : payment === "REFUNDED"
                                          ? "refunded"
                                          : "pending"
                                  }"
                                >
                                  ${esc(
                                    payment
                                  )}
                                </span>

                                <br>

                                <select
                                  class="paymentSelect"
                                  onchange="
                                    changePaymentStatus(
                                      ${Number(order.id)},
                                      this.value
                                    )
                                  "
                                >

                                  ${
                                    [
                                      "PENDING",
                                      "PAID",
                                      "FAILED",
                                      "REFUNDED"
                                    ]
                                    .map(
                                      status => `

                                        <option
                                          value="${status}"
                                          ${
                                            status === payment
                                              ? "selected"
                                              : ""
                                          }
                                        >
                                          ${status}
                                        </option>

                                      `
                                    )
                                    .join("")
                                  }

                                </select>

                              </td>


                              <td>

                                <span
                                  class="pill ${
                                    statusClass(
                                      orderStatus
                                    )
                                  }"
                                >
                                  ${esc(
                                    orderStatus
                                  )}
                                </span>

                                <br>

                                <select
                                  class="statusSelect"
                                  onchange="
                                    changeOrderStatus(
                                      ${Number(order.id)},
                                      this.value
                                    )
                                  "
                                >

                                  ${
                                    [
                                      "PENDING",
                                      "PROCESSING",
                                      "SHIPPED",
                                      "DELIVERED",
                                      "CANCELLED"
                                    ]
                                    .map(
                                      status => `

                                        <option
                                          value="${status}"
                                          ${
                                            status === orderStatus
                                              ? "selected"
                                              : ""
                                          }
                                        >
                                          ${status}
                                        </option>

                                      `
                                    )
                                    .join("")
                                  }

                                </select>

                              </td>


                              <td>
                                ${formatDate(
                                  order.created_at
                                )}
                              </td>

                            </tr>

                          `;

                        }
                      )
                      .join("")
                  }

                </tbody>

              </table>

            </div>

          `

          : `

            <div class="empty">
              No orders found.
            </div>

          `
      }

    </div>

  `;

}


/* =========================================================
   CHANGE ORDER STATUS
========================================================= */

async function changeOrderStatus(
  id,
  status
){

  const data =
    await api(
      "/api/admin/orders/" +
      encodeURIComponent(id),
      {
        method:"PATCH",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            order_status:
              String(
                status
              ).toUpperCase()
          })
      }
    );

  if(
    !data ||
    data.error ||
    data.ok !== true
  ){

    alert(
      data?.message ||
      data?.error ||
      "Unable to update order status."
    );

    showOrders();

    return;

  }

  await refreshDashboardData();

}


/* =========================================================
   CHANGE PAYMENT STATUS
========================================================= */

async function changePaymentStatus(
  id,
  status
){

  const confirmed =
    confirm(
      "Change payment status to " +
      status +
      "?"
    );

  if(!confirmed){

    showOrders();

    return;

  }

  const data =
    await api(
      "/api/admin/orders/" +
      encodeURIComponent(id) +
      "/payment",
      {
        method:"PATCH",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            payment_status:
              String(
                status
              ).toUpperCase()
          })
      }
    );

  if(
    !data ||
    data.error ||
    data.ok !== true
  ){

    alert(
      data?.message ||
      data?.error ||
      "Unable to update payment status."
    );

    showOrders();

    return;

  }

  await refreshDashboardData();

}


/* =========================================================
   REFRESH DASHBOARD DATA
========================================================= */

async function refreshDashboardData(){

  const ordersData =
    await api(
      "/api/admin/orders"
    );

  const productsData =
    await api(
      "/api/admin/products"
    );

  if(
    ordersData &&
    Array.isArray(
      ordersData.orders
    )
  ){

    allOrders =
      ordersData.orders;

  }

  if(
    productsData &&
    Array.isArray(
      productsData.products
    )
  ){

    allProducts =
      productsData.products;

  }

  renderDashboard();

}


/* =========================================================
   PRODUCTS
========================================================= */

async function showProducts(){

  activeTab("tabProducts");

  const content =
    document.getElementById(
      "content"
    );

  content.innerHTML = `

    <div class="panel">

      <div class="panelHead">

        <h2>
          Products
        </h2>

        <button
          class="addBtn"
          onclick="openProductModal()"
        >
          + Add Product
        </button>

      </div>

      <div class="loading">
        Loading products...
      </div>

    </div>

  `;

  const data =
    await api(
      "/api/admin/products"
    );

  if(!data){
    return;
  }

  if(data.error){

    content.innerHTML = `

      <div class="panel">

        <h2>
          Products
        </h2>

        <p class="error">
          ${esc(data.error)}
        </p>

      </div>

    `;

    return;

  }

  allProducts =
    Array.isArray(
      data.products
    )
      ? data.products
      : [];

  renderProducts(
    allProducts
  );

}


function renderProducts(
  products
){

  const content =
    document.getElementById(
      "content"
    );

  content.innerHTML = `

    <div class="panel">

      <div class="panelHead">

        <h2>
          Products
        </h2>

        <button
          class="addBtn"
          onclick="openProductModal()"
        >
          + Add Product
        </button>

      </div>

      <input
        class="search"
        id="productSearch"
        placeholder="Search products..."
        oninput="filterProducts(this.value)"
      >

      <div
        id="productsList"
        class="productGrid"
      ></div>

    </div>

  `;

  drawProductCards(
    products
  );

}


function filterProducts(
  value
){

  const query =
    String(
      value || ""
    )
    .toLowerCase()
    .trim();

  const filtered =
    allProducts.filter(
      product => {

        const name =
          String(
            product.name || ""
          ).toLowerCase();

        const category =
          String(
            product.category ||
            product.cat ||
            ""
          ).toLowerCase();

        const color =
          String(
            product.color ||
            ""
          ).toLowerCase();

        return (
          name.includes(query) ||
          category.includes(query) ||
          color.includes(query)
        );

      }
    );

  drawProductCards(
    filtered
  );

}


function drawProductCards(
  products
){

  const container =
    document.getElementById(
      "productsList"
    );

  if(!container){
    return;
  }

  if(!products.length){

    container.innerHTML = `

      <div
        class="empty"
        style="grid-column:1/-1"
      >
        No products found.
      </div>

    `;

    return;

  }

  container.innerHTML =
    products
      .map(
        product => {

          const image =
            normalizeImage(
              product.image ||
              product.img
            );

          const category =
            product.category ||
            product.cat ||
            "Fashion";

          const description =
            product.description ||
            product.desc ||
            "";

          const stock =
            Number(
              product.stock || 0
            );

          const active =
            product.active !== false;

          return `

            <div class="productCard">

              ${
                image

                  ? `

                    <img
                      class="productImage"
                      src="${esc(image)}"
                      alt="${esc(
                        product.name
                      )}"
                      onerror="
                        this.onerror=null;
                        this.style.display='none';
                        this.nextElementSibling.style.display='flex';
                      "
                    >

                    <div
                      class="noImage"
                      style="display:none"
                    >
                      Image unavailable
                    </div>

                  `

                  : `

                    <div class="noImage">
                      No Image
                    </div>

                  `
              }


              <div class="productInfo">

                <h3>
                  ${esc(
                    product.name
                  )}
                </h3>

                <div class="productMeta">

                  Category:
                  ${esc(category)}

                  <br>

                  Color:
                  ${esc(
                    product.color ||
                    "-"
                  )}

                  <br>

                  Stock:
                  <b>
                    ${stock}
                  </b>

                  <br>

                  Status:
                  <b>
                    ${
                      active
                        ? "Active"
                        : "Hidden"
                    }
                  </b>

                </div>


                <div class="productPrice">
                  ${money(
                    product.price
                  )}
                </div>


                <div
                  style="
                    font-size:12px;
                    color:#756a6f;
                    margin-bottom:12px;
                    line-height:1.5;
                  "
                >
                  ${esc(
                    description
                  )}
                </div>


                <div class="productActions">

                  <button
                    class="edit"
                    onclick="
                      editProduct(
                        ${Number(product.id)}
                      )
                    "
                  >
                    Edit
                  </button>

                  <button
                    class="delete"
                    onclick="
                      deleteProduct(
                        ${Number(product.id)}
                      )
                    "
                  >
                    Remove
                  </button>

                </div>

              </div>

            </div>

          `;

        }
      )
      .join("");

}


/* =========================================================
   PRODUCT MODAL
========================================================= */

  product=null
){

  const editing =
    Boolean(product);

  selectedImage = "";

  document
    .getElementById(
      "productModal"
    )
    ?.remove();

  document.body.insertAdjacentHTML(
    "beforeend",

    `

      <div
        class="modal"
        id="productModal"
      >

        <div class="modalBox">

          <div class="modalHead">

            <h2>
              ${
                editing
                  ? "Edit Product"
                  : "Add Product"
              }
            </h2>

            <button
              class="close"
              onclick="closeProductModal()"
            >
              ×
            </button>

          </div>


          <div class="formGrid">


            <div>

              <label>
                Product Name
              </label>

              <input
                id="productName"
                value="${esc(
                  product?.name ||
                  ""
                )}"
                placeholder="Elegant Zip Abaya"
              >

            </div>


            <div>

              <label>
                Category
              </label>

              <input
                id="productCategory"
                value="${esc(
                  product?.category ||
                  product?.cat ||
                  "Fashion"
                )}"
                placeholder="Hijab, Abaya, Gown"
              >

            </div>


            <div>

              <label>
                Price (₦)
              </label>

              <input
                id="productPrice"
                type="number"
                min="0"
                step="0.01"
                value="${Number(
                  product?.price || 0
                )}"
              >

            </div>


            <div>

              <label>
                Color
              </label>

              <input
                id="productColor"
                value="${esc(
                  product?.color ||
                  ""
                )}"
                placeholder="Black, Wine, Rose..."
              >

            </div>


            <div>

              <label>
                Stock Quantity
              </label>

              <input
                id="productStock"
                type="number"
                min="0"
                step="1"
                value="${Number(
                  product?.stock ?? 0
                )}"
              >

            </div>


            <div>

              <label>
                Product Status
              </label>

              <select
                id="productActive"
              >

                <option
                  value="true"
                  ${
                    product?.active !== false
                      ? "selected"
                      : ""
                  }
                >
                  Active
                </option>

                <option
                  value="false"
                  ${
                    product?.active === false
                      ? "selected"
                      : ""
                  }
                >
                  Hidden
                </option>

              </select>

            </div>


            <div class="full">

              <label>
                Product Image
              </label>

              <input
                id="productImage"
                value="${esc(
                  product?.image ||
                  product?.img ||
                  ""
                )}"
                placeholder="product-1.jpg"
                oninput="previewImageFromText(this.value)"
              >

              <div class="imageHelp">

                <b>Image path:</b>
                use the filename inside
                <b>public/assets</b>.

                <br>

                Example:
                <b>product-1.jpg</b>

                <br>

                You can also use a complete HTTPS image URL.

                <br><br>

                This keeps the image compatible with the current
                Version 2 server/database structure.

              </div>

              <img
                id="imagePreview"
                class="preview"
                src=""
                alt="Product preview"
                style="display:none"
                onerror="
                  this.style.display='none'
                "
              >

            </div>


            <div class="full">

              <label>
                Description
              </label>

              <textarea
                id="productDescription"
                placeholder="Describe the product..."
              >${esc(
                product?.description ||

          </div>


          <button

    "";

    );

}


/* =========================================================
   IMAGE PREVIEW
========================================================= */

function previewImageFromText(
  value
){

  const image =
    normalizeImage(
      value
    );

  const preview =
    document.getElementById(
      "imagePreview"
    );

  if(!preview){
    return;
  }

  if(!image){

    preview.style.display =
      "none";

    return;

  }

  preview.src =
    image;

  preview.style.display =
    "block";

}


/* =========================================================
   CLOSE PRODUCT MODAL
========================================================= */

function closeProductModal(){

  document
    .getElementById(
      "productModal"
    )
    ?.remove();

  selectedImage = "";

}


/* =========================================================
   SAVE PRODUCT
========================================================= */

async function saveProduct(
  id
){

  const message =
    document.getElementById(
      "productMessage"
    );

  const name =
    document
      .getElementById(
        "productName"
      )
      .value
      .trim();

  const category =
    document
      .getElementById(
        "productCategory"
      )
      .value
      .trim();

  const description =
    document
      .getElementById(
        "productDescription"
      )
      .value
      .trim();

  const price =
    Number(
      document
        .getElementById(
          "productPrice"
        )
        .value
    );

  const color =
    document
      .getElementById(
        "productColor"
      )
      .value
      .trim();

  const stock =
    Number(
      document
        .getElementById(
          "productStock"
        )
        .value
    );

  const active =
    document
      .getElementById(
        "productActive"
      )
      .value === "true";

  const image =
    document
      .getElementById(
        "productImage"
      )
      .value
      .trim();


  if(!name){

    message.className =
      "error";

    message.textContent =
      "Product name is required.";

    return;

  }


  if(
    !Number.isFinite(price) ||
    price < 0
  ){

    message.className =
      "error";

    message.textContent =
      "Please enter a valid price.";

    return;

  }


  if(
    !Number.isInteger(stock) ||
    stock < 0
  ){

    message.className =
      "error";

    message.textContent =
      "Please enter a valid stock quantity.";

    return;

  }


  if(
    image.length > 1000
  ){

    message.className =
      "error";

    message.textContent =
      "Image path is too long.";

    return;

  }


  const payload = {

    name,

    category,

    description,

    price,

    color,

    stock,

    active,

    image

  };


  message.className =
    "";

  message.textContent =
    "Saving product...";


  const url =
    id

      ? "/api/admin/products/" +
        encodeURIComponent(id)

      : "/api/admin/products";


  const response =
    await api(
      url,
      {

        method:
          id
            ? "PUT"
            : "POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify(
            payload
          )

      }
    );


  if(
    response &&
    response.ok
  ){

    message.className =
      "success";

    message.textContent =
      "Product saved successfully.";

    setTimeout(
      async () => {

        closeProductModal();

        await loadProducts();

        showProducts();

      },
      500
    );

    return;

  }


  message.className =
    "error";

  message.textContent =
    response?.message ||
    response?.error ||
    "Unable to save product.";

}


/* =========================================================
   LOAD PRODUCTS
========================================================= */

async function loadProducts(){

  const data =
    await api(
      "/api/admin/products"
    );

  if(
    data &&
    Array.isArray(
      data.products
    )
  ){

    allProducts =
      data.products;

  }

}


/* =========================================================
   EDIT PRODUCT
========================================================= */

function editProduct(
  id
){

  const product =
    allProducts.find(
      item =>
        Number(item.id) ===
        Number(id)
    );

  if(!product){

    alert(
      "Product not found."
    );

    return;

  }

  openProductModal(
    product
  );

}


/* =========================================================
   REMOVE PRODUCT
========================================================= */

async function deleteProduct(
  id
){

  const product =
    allProducts.find(
      item =>
        Number(item.id) ===
        Number(id)
    );

  if(!product){
    return;
  }

  const confirmed =
    confirm(
      'Remove "' +
      product.name +
      '" from the store?'
    );

  if(!confirmed){
    return;
  }

  const data =
    await api(
      "/api/admin/products/" +
      encodeURIComponent(id),
      {
        method:"DELETE"
      }
    );

  if(
    data &&
    data.ok
  ){

    await loadProducts();

    showProducts();

    return;

  }

  alert(
    data?.message ||
    data?.error ||
    "Unable to remove product."
  );

}


/* =========================================================
   INITIAL SESSION CHECK
========================================================= */

async function checkSession(){

  if(!token){

    login();

    return;

  }

  const data =
    await api(
      "/api/admin/me"
    );

  if(
    data &&
    data.ok
  ){

    await dashboard();

  }else{

    sessionStorage.removeItem(
      "adminToken"
    );

    token = "";

    login();

  }

}


/* =========================================================
   START
========================================================= */

checkSession();
