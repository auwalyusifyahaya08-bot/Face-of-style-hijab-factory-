<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<meta
  name="theme-color"
  content="#651630"
>

<title>
Admin Dashboard | Face of Style
</title>

<style>

:root{
  --wine:#651630;
  --wine2:#4d1024;
  --gold:#c9a45b;
  --bg:#f7f2eb;
  --line:#e6dacf;
  --text:#292025;
  --muted:#756a6f;
  --white:#fff;
  --green:#16803c;
  --red:#a32626;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  font-family:Arial,sans-serif;
  color:var(--text);
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.top{
  background:#fff;
  border-bottom:1px solid var(--line);
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:20;
}

.brand{
  font:22px Georgia,serif;
  color:var(--wine);
}

.logout{
  background:#fff;
  border:1px solid var(--line);
  padding:9px 15px;
  border-radius:22px;
}

.layout{
  max-width:1450px;
  margin:auto;
  padding:22px 18px 50px;
}

.login{
  max-width:410px;
  margin:9vh auto;
  background:#fff;
  padding:32px;
  border-radius:22px;
  box-shadow:0 12px 35px #32121b16;
}

.login h1,
.panel h2{
  font-family:Georgia,serif;
  color:var(--wine);
}

.login h1{
  font-size:31px;
  margin:0 0 8px;
}

label{
  display:block;
  font-weight:bold;
  font-size:13px;
  margin-top:4px;
}

input,
select,
textarea{
  width:100%;
  padding:12px;
  border:1px solid var(--line);
  border-radius:11px;
  margin:7px 0 14px;
  background:#fff;
  color:var(--text);
}

textarea{
  min-height:105px;
  resize:vertical;
}

.primary,
.addBtn{
  background:var(--wine);
  color:#fff;
  border:0;
  padding:12px 18px;
  border-radius:23px;
  font-weight:bold;
}

.primary:hover,
.addBtn:hover{
  background:var(--wine2);
}

.error{
  color:var(--red);
  font-size:13px;
}

.success{
  color:var(--green);
  font-size:13px;
}

.notice{
  background:#fcf8f1;
  padding:13px;
  border-radius:11px;
  color:#665d60;
  font-size:13px;
  line-height:1.6;
}

.cards{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:14px;
}

.stat{
  background:#fff;
  border:1px solid var(--line);
  padding:18px;
  border-radius:17px;
}

.stat small{
  color:var(--muted);
}

.stat b{
  display:block;
  color:var(--wine);
  font-size:25px;
  margin-top:6px;
}

.tabs{
  display:flex;
  gap:8px;
  margin:22px 0;
  flex-wrap:wrap;
}

.tab{
  padding:10px 17px;
  border:1px solid var(--line);
  background:#fff;
  border-radius:22px;
}

.tab.active{
  background:var(--wine);
  color:#fff;
}

.panel{
  background:#fff;
  border:1px solid var(--line);
  border-radius:19px;
  padding:20px;
  margin-bottom:20px;
}

.panelHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:15px;
}

.panel h2{
  font-size:25px;
  margin:0;
}

.search{
  max-width:360px;
}

.productGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:17px;
}

.productCard{
  border:1px solid var(--line);
  border-radius:17px;
  overflow:hidden;
  background:#fff;
}

.productImage{
  width:100%;
  height:235px;
  object-fit:cover;
  background:#f4eee7;
  display:block;
}

.productInfo{
  padding:15px;
}

.productInfo h3{
  margin:0 0 7px;
  color:var(--wine);
  font-family:Georgia,serif;
}

.productMeta{
  font-size:13px;
  color:#6d6367;
  line-height:1.7;
}

.productPrice{
  font-weight:bold;
  font-size:19px;
  margin:9px 0;
  color:var(--wine);
}

.productActions{
  display:flex;
  gap:8px;
}

.productActions button{
  flex:1;
  padding:9px;
  border-radius:18px;
  border:1px solid var(--line);
  background:#fff;
}

.edit{
  background:#fff8e8!important;
}

.delete{
  color:#9a2222!important;
}

.formGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0 16px;
}

.full{
  grid-column:1/-1;
}

.uploadBox{
  border:2px dashed var(--line);
  border-radius:14px;
  padding:18px;
  text-align:center;
  background:#fcfaf7;
  margin:7px 0 14px;
}

.uploadBox input{
  display:none;
}

.uploadBtn{
  display:inline-block;
  background:var(--wine);
  color:#fff;
  padding:11px 17px;
  border-radius:22px;
  font-weight:bold;
}

.previewGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  margin:10px 0;
}

.previewGrid img{
  width:100%;
  height:110px;
  object-fit:cover;
  border-radius:10px;
  border:1px solid var(--line);
}

.tableWrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:950px;
}

th,
td{
  text-align:left;
  padding:12px 10px;
  border-bottom:1px solid var(--line);
  vertical-align:top;
}

th{
  color:var(--wine);
  font-family:Georgia,serif;
}

.pill{
  display:inline-block;
  padding:5px 9px;
  border-radius:14px;
  font-size:11px;
  font-weight:bold;
}

.paid{
  background:#e5f5ea;
  color:#176a35;
}

.pending{
  background:#fff1cf;
  color:#8a5a00;
}

.failed,
.cancelled{
  background:#fde7e7;
  color:#9a2222;
}

.new{
  background:#e8eefc;
  color:#294f9b;
}

.processing{
  background:#fff1cf;
  color:#8a5a00;
}

.ready{
  background:#eee6fb;
  color:#63349a;
}

.shipped{
  background:#e6f6f6;
  color:#176b6b;
}

.delivered{
  background:#e5f5ea;
  color:#176a35;
}

.empty{
  text-align:center;
  padding:30px;
  color:var(--muted);
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:50;
}

.modalBox{
  background:#fff;
  width:min(750px,100%);
  max-height:92vh;
  overflow:auto;
  border-radius:20px;
  padding:22px;
}

.modalHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.close{
  border:0;
  background:#f4eee7;
  border-radius:50%;
  width:38px;
  height:38px;
  font-size:20px;
}

.loading{
  padding:20px;
  text-align:center;
  color:var(--muted);
}

.settingsGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0 18px;
}

.settingFull{
  grid-column:1/-1;
}

.switchRow{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 0;
}

.switchRow input{
  width:auto;
  margin:0;
}

.orderAction{
  border:1px solid var(--line);
  background:#fff;
  padding:7px 10px;
  border-radius:15px;
}

.statusSelect{
  min-width:130px;
  margin:0;
}

@media(max-width:1100px){

  .cards{
    grid-template-columns:repeat(3,1fr);
  }

  .productGrid{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:700px){

  .cards{
    grid-template-columns:1fr 1fr;
  }

  .productGrid{
    grid-template-columns:1fr;
  }

  .formGrid,
  .settingsGrid{
    grid-template-columns:1fr;
  }

  .full,
  .settingFull{
    grid-column:auto;
  }

  .top{
    padding:12px 14px;
  }

  .brand{
    font-size:18px;
  }

  .layout{
    padding:16px 11px 40px;
  }

  .panel{
    padding:15px;
  }

  .panelHead{
    align-items:stretch;
    flex-direction:column;
  }

  .search{
    max-width:none;
  }

  .previewGrid{
    grid-template-columns:repeat(2,1fr);
  }

}

</style>

</head>

<body>

<div class="top">

  <b class="brand">
    FACE OF STYLE — ADMIN
  </b>

  <button
    class="logout"
    onclick="logout()"
  >
    Logout
  </button>

</div>


<div id="app"></div>


<script>

const app =
  document.getElementById(
    "app"
  );

let token =
  sessionStorage.getItem(
    "adminToken"
  ) || "";

let allProducts = [];

let selectedImages = [];


function esc(value){

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function money(value){

  return "₦" +
    Number(
      value || 0
    ).toLocaleString(
      "en-NG"
    );

}


function normalizeImage(value){

  let image =
    String(
      value || ""
    ).trim();

  if(!image){
    return "/product-1.jpg";
  }

  if(
    /^https?:\/\//i.test(image) ||
    image.startsWith(
      "data:image/"
    )
  ){

    return image;

  }

  image =
    image.replace(
      /^\.?\/?assets\//i,
      "/"
    );

  if(
    !image.startsWith("/")
  ){

    image =
      "/" + image;

  }

  return image;

}


function login(){

  app.innerHTML = `

    <div class="login">

      <h1>
        Admin Login
      </h1>

      <p>
        Face of Style Hijab Factory
      </p>

      <label>
        Username
      </label>

      <input
        id="username"
        value="admin"
        autocomplete="username"
      >

      <label>
        Password
      </label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
      >

      <button
        class="primary"
        style="width:100%"
        onclick="doLogin()"
      >
        LOGIN
      </button>

      <p
        id="loginError"
        class="error"
      ></p>

    </div>

  `;

}


async function doLogin(){

  const error =
    document.getElementById(
      "loginError"
    );

  error.textContent =
    "";

  try{

    const response =
      await fetch(
        "/api/admin/login",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              username:
                document.getElementById(
                  "username"
                ).value.trim(),

              password:
                document.getElementById(
                  "password"
                ).value

            })

        }
      );


    const data =
      await response.json();


    if(data.token){

      token =
        data.token;

      sessionStorage.setItem(
        "adminToken",
        token
      );

      dashboard();

    }else{

      error.textContent =
        data.message ||
        "Login failed.";

    }

  }catch(errorObject){

    console.error(
      errorObject
    );

    error.textContent =
      "Unable to connect to server.";

  }

}


function logout(){

  if(token){

    fetch(
      "/api/admin/logout",
      {
        method:"POST",
        headers:{
          Authorization:
            "Bearer " +
            token
        }
      }
    ).catch(
      () => {}
    );

  }

  sessionStorage.removeItem(
    "adminToken"
  );

  token =
    "";

  login();

}


async function api(
  url,
  options={}
){

  options.headers = {

    ...(options.headers || {}),

    Authorization:
      "Bearer " +
      token

  };


  try{

    const response =
      await fetch(
        url,
        options
      );


    if(
      response.status ===
      401
    ){

      logout();

      return null;

    }


    const text =
      await response.text();


    try{

      return JSON.parse(
        text
      );

    }catch{

      return {

        error:
          text ||
          "Server returned an invalid response."

      };

    }

  }catch(error){

    console.error(
      error
    );

    return {

      error:
        "Unable to connect to server."

    };

  }

}


async function dashboard(){

  const data =
    await api(
      "/api/admin/dashboard"
    );


  if(!data){
    return;
  }


  const stats =
    data.stats || {};


  app.innerHTML = `

    <div class="layout">

      <div class="cards">

        <div class="stat">
          <small>Total Orders</small>
          <b>${stats.orders || 0}</b>
        </div>

        <div class="stat">
          <small>Paid Orders</small>
          <b>${stats.paid || 0}</b>
        </div>

        <div class="stat">
          <small>Pending Orders</small>
          <b>${stats.pending || 0}</b>
        </div>

        <div class="stat">
          <small>Processing</small>
          <b>${stats.processing || 0}</b>
        </div>

        <div class="stat">
          <small>Revenue</small>
          <b>${money(stats.revenue)}</b>
        </div>

      </div>


      <div class="tabs">

        <button
          id="tabOrders"
          class="tab active"
          onclick="showOrders()"
        >
          Orders
        </button>

        <button
          id="tabProducts"
          class="tab"
          onclick="showProducts()"
        >
          Products
        </button>

        <button
          id="tabSettings"
          class="tab"
          onclick="showSettings()"
        >
          Settings
        </button>

      </div>


      <div id="content"></div>

    </div>

  `;


  showOrders();

}


function activeTab(id){

  document
    .querySelectorAll(
      ".tab"
    )
    .forEach(
      item =>
        item.classList.remove(
          "active"
        )
    );


  const element =
    document.getElementById(
      id
    );


  if(element){

    element.classList.add(
      "active"
    );

  }

}


async function showOrders(){

  activeTab(
    "tabOrders"
  );


  const content =
    document.getElementById(
      "content"
    );


  content.innerHTML = `

    <div class="panel">

      <h2>
        Orders
      </h2>

      <div class="loading">
        Loading orders...
      </div>

    </div>

  `;


  const data =
    await api(
      "/api/admin/orders"
    );


  if(!data){
    return;
  }


  const orders =
    Array.isArray(
      data.orders
    )
      ? data.orders
      : [];


  content.innerHTML = `

    <div class="panel">

      <div class="panelHead">

        <h2>
          Customer Orders
        </h2>

        <button
          class="addBtn"
          onclick="showOrders()"
        >
          Refresh
        </button>

      </div>


      <div class="notice">

        Payment status is controlled by
        Paystack verification.
        Order status is your delivery workflow.

      </div>


      ${
        orders.length

        ?

        `

        <div class="tableWrap"
             style="margin-top:15px">

          <table>

            <thead>

              <tr>

                <th>
                  Reference
                </th>

                <th>
                  Customer
                </th>

                <th>
                  Items
                </th>

                <th>
                  Total
                </th>

                <th>
                  Payment
                </th>

                <th>
                  Order Status
                </th>

                <th>
                  Date
                </th>

              </tr>

            </thead>


            <tbody>

              ${
                orders
                  .map(
                    order => {

                      const payment =
                        order.status ||
                        "pending";

                      const orderStatus =
                        order.orderStatus ||
                        "new";


                      const customer =
                        order.customer ||
                        {};


                      const items =
                        Array.isArray(
                          order.items
                        )
                          ? order.items
                          : [];


                      return `

                        <tr>

                          <td>

                            <b>
                              ${esc(
                                order.reference ||
                                "-"
                              )}
                            </b>

                          </td>


                          <td>

                            ${esc(
                              customer.name ||
                              "-"
                            )}

                            <br>

                            <small>
                              ${esc(
                                customer.phone ||
                                "-"
                              )}
                            </small>

                            <br>

                            <small>
                              ${esc(
                                customer.email ||
                                ""
                              )}
                            </small>

                          </td>


                          <td>

                            ${
                              items
                                .map(
                                  item =>
                                    `${esc(
                                      item.name ||
                                      "Product"
                                    )} × ${Number(
                                      item.qty ||
                                      0
                                    )}`
                                )
                                .join(
                                  "<br>"
                                )
                            }

                          </td>


                          <td>
                            ${money(
                              order.total
                            )}
                          </td>


                          <td>

                            <span
                              class="pill ${
                                payment ===
                                "paid"

                                  ? "paid"

                                  : payment ===
                                    "failed"

                                    ? "failed"

                                    : "pending"
                              }"
                            >
                              ${esc(
                                payment
                              )}
                            </span>

                            <br>

                            <small>
                              ${esc(
                                order.payment?.provider ||
                                "-"
                              )}
                            </small>

                          </td>


                          <td>

                            <select
                              class="statusSelect"
                              onchange="changeOrderStatus('${esc(order.id)}',this.value)"
                            >

                              ${
                                [
                                  "new",
                                  "processing",
                                  "ready",
                                  "shipped",
                                  "delivered",
                                  "cancelled"
                                ]
                                  .map(
                                    status => `

                                      <option
                                        value="${status}"
                                        ${
                                          status ===
                                          orderStatus
                                            ? "selected"
                                            : ""
                                        }
                                      >
                                        ${status}
                                      </option>

                                    `
                                  )
                                  .join("")
                              }

                            </select>

                          </td>


                          <td>

                            ${
                              order.createdAt

                                ? new Date(
                                    order.createdAt
                                  ).toLocaleString(
                                    "en-NG"
                                  )

                                : "-"
                            }

                          </td>

                        </tr>

                      `;

                    }
                  )
                  .join("")
              }

            </tbody>

          </table>

        </div>

        `

        :

        `
          <div class="empty">
            No orders found.
          </div>
        `

      }

    </div>

  `;

}


async function changeOrderStatus(
  id,
  status
){

  const data =
    await api(
      "/api/admin/orders/" +
      encodeURIComponent(
        id
      ) +
      "/status",
      {
        method:"PUT",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            status
          })

      }
    );


  if(
    data?.error ||
    data?.message &&
    !data.ok
  ){

    alert(
      data.message ||
      data.error ||
      "Unable to update order."
    );

    return;

  }


  showOrders();

}


async function showProducts(){

  activeTab(
    "tabProducts"
  );


  const content =
    document.getElementById(
      "content"
    );


  content.innerHTML = `

    <div class="panel">

      <h2>
        Products
      </h2>

      <div class="loading">
        Loading products...
      </div>

    </div>

  `;


  const data =
    await api(
      "/api/admin/products"
    );


  if(!data){
    return;
  }


  allProducts =
    Array.isArray(
      data.products
    )
      ? data.products
      : [];


  renderProducts(
    allProducts
  );

}


function renderProducts(
  products
){

  const content =
    document.getElementById(
      "content"
    );


  content.innerHTML = `

    <div class="panel">

      <div class="panelHead">

        <h2>
          Products
        </h2>

        <button
          class="addBtn"
          onclick="openProductModal()"
        >
          + Add Product
        </button>

      </div>


      <input
        class="search"
        id="productSearch"
        placeholder="Search products..."
        oninput="filterProducts(this.value)"
      >


      <div
        id="productsList"
        class="productGrid"
        style="margin-top:15px"
      ></div>

    </div>

  `;


  drawProductCards(
    products
  );

}


function filterProducts(
  value
){

  const query =
    String(
      value || ""
    )
      .toLowerCase()
      .trim();


  const filtered =
    allProducts.filter(
      product => {

        const name =
          String(
            product.name ||
            ""
          ).toLowerCase();

        const category =
          String(
            product.cat ||
            product.category ||
            ""
          ).toLowerCase();

        return (
          name.includes(
            query
          ) ||
          category.includes(
            query
          )
        );

      }
    );


  drawProductCards(
    filtered
  );

}


function drawProductCards(
  products
){

  const container =
    document.getElementById(
      "productsList"
    );


  if(!container){
    return;
  }


  if(!products.length){

    container.innerHTML = `

      <div
        class="empty"
        style="grid-column:1/-1"
      >
        No products found.
      </div>

    `;

    return;

  }


  container.innerHTML =
    products
      .map(
        product => {

          const image =
            normalizeImage(
              product.image ||
              product.img
            );


          const category =

function previewImage(
  input
){

  const file =
    input.files?.[0];


  if(!file){
    return;
  }


  if(
    file.size >
    7000000
  ){

    alert(
      "Image is too large. Please choose an image under about 5MB."
    );

    input.value =
      "";

    return;

  }


  const reader =
    new FileReader();


  reader.onload =
    event => {

      selectedImages =
        [
          event.target.result
        ];


      const preview =
        document.getElementById(
          "previewGrid"
        );


      preview.innerHTML = `

        <img
          src="${event.target.result}"
          alt="Preview"
        >

      `;

    };


  reader.readAsDataURL(
    file
  );

}


function closeProductModal(){

  document

      "productModal"

async function saveProduct(
  id
){

  const message =
    document.getElementById(
      "productMessage"
    );


  const imageInput =
    document.getElementById(
      "productImage"
    );


  const imageUrl =
    imageInput.value.trim();


  const image =
    imageUrl ||
    selectedImages[0] ||
    "";


  const data = {

    name:
      document
        .getElementById(
          "productName"
        )
        .value
        .trim(),

    cat:
      document
        .getElementById(
          "productCategory"
        )
        .value,

    price:
      Number(
        document
          .getElementById(
            "productPrice"
          )
          .value
      ),

    color:
      document
        .getElementById(
          "productColor"
        )
        .value
        .trim(),

    stock:
      Number(
        document
          .getElementById(
            "productStock"
          )
          .value
      ),

    active:
      document
        .getElementById(
          "productActive"
        )
        .value ===
      "true",

    image,

    desc:
      document
        .getElementById(
          "productDescription"
        )
        .value
        .trim()

  };


  if(!data.name){

    message.className =
      "error";

    message.textContent =
      "Product name is required.";

    return;

  }


  if(
    !Number.isFinite(
      data.price
    ) ||
    data.price < 0
  ){

    message.className =
      "error";

    message.textContent =
      "Please enter a valid price.";

    return;

  }


  if(
    !Number.isInteger(
      data.stock
    ) ||
    data.stock < 0
  ){

    message.className =
      "error";

    message.textContent =
      "Please enter a valid stock quantity.";

    return;

  }


  message.className =
    "";

  message.textContent =
    "Saving...";


  const url =
    id

      ? "/api/admin/products/" +
        encodeURIComponent(id)

      : "/api/admin/products";


  const response =
    await api(
      url,
      {

        method:
          id
            ? "PUT"
            : "POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify(
            data
          )

      }
    );


  if(
    response &&
    !response.error &&
    response.message !==
      "Product name and valid price are required."
  ){

    message.className =
      "success";

    message.textContent =
      "Product saved successfully.";


    setTimeout(
      () => {

        closeProductModal();

        showProducts();

      },
      600
    );


  }else{

    message.className =
      "error";

    message.textContent =
      response?.message ||
      response?.error ||
      "Unable to save product.";

  }

}


async function editProduct(
  id
){

  const product =
    allProducts.find(
      item =>
        Number(item.id) ===
        Number(id)
    );


  if(!product){
    return;
  }


  openProductModal(
    product
  );

}


async function deleteProduct(
  id
){

  if(
    !confirm(
      "Delete this product?"
    )
  ){

    return;

  }


  const data =
    await api(
      "/api/admin/products/" +
      encodeURIComponent(
        id
      ),
      {
        method:
          "DELETE"
      }
    );


  if(
    data &&
    data.ok
  ){

    showProducts();

  }else{

    alert(
      data?.message ||
      data?.error ||
      "Unable to delete product."
    );

  }

}
