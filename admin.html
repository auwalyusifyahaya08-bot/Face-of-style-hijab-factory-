<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Admin Dashboard | Face of Style</title>

<style>
:root{
  --wine:#651630;
  --gold:#c9a45b;
  --bg:#f7f2eb;
  --card:#fff;
  --line:#e6dacf;
  --text:#292025;
  --muted:#756a6f;
  --danger:#a33;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}

button{
  cursor:pointer;
  font-family:inherit;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

input,
select,
textarea{
  width:100%;
  padding:12px 13px;
  border:1px solid var(--line);
  border-radius:10px;
  margin:7px 0 14px;
  font-family:inherit;
  font-size:14px;
  outline:none;
  background:#fff;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px #c9a45b20;
}

.top{
  background:#fff;
  border-bottom:1px solid var(--line);
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  position:sticky;
  top:0;
  z-index:20;
}

.top b{
  font:22px Georgia,serif;
  color:var(--wine);
}

.top small{
  display:block;
  color:var(--muted);
  margin-top:3px;
}

.logout{
  background:#fff;
  border:1px solid var(--line);
  padding:9px 15px;
  border-radius:20px;
  color:var(--wine);
  font-weight:bold;
}

.layout{
  max-width:1250px;
  margin:auto;
  padding:25px 18px 50px;
}

.login-wrap{
  min-height:calc(100vh - 70px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px 15px;
}

.login{
  width:100%;
  max-width:410px;
  background:#fff;
  padding:32px;
  border-radius:22px;
  box-shadow:0 15px 45px #32121b14;
  border:1px solid var(--line);
}

.login-logo{
  width:68px;
  height:68px;
  border-radius:50%;
  margin:0 auto 15px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--wine);
  color:#fff;
  font:bold 22px Georgia,serif;
}

.login h1{
  text-align:center;
  font:32px Georgia,serif;
  color:var(--wine);
  margin:5px 0;
}

.login-sub{
  text-align:center;
  color:var(--muted);
  margin-bottom:25px;
}

.primary{
  width:100%;
  background:var(--wine);
  color:#fff;
  border:0;
  padding:13px;
  border-radius:22px;
  font-weight:bold;
  font-size:14px;
}

.secondary{
  background:#fff;
  color:var(--wine);
  border:1px solid var(--line);
  padding:11px 16px;
  border-radius:22px;
  font-weight:bold;
}

.error{
  color:var(--danger);
  font-size:13px;
  min-height:18px;
}

.success{
  color:#176a35;
  font-size:13px;
}

.notice{
  background:#fcf8f1;
  padding:13px;
  border-radius:11px;
  color:#665d60;
  font-size:13px;
  line-height:1.6;
  margin-top:15px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.stat{
  background:var(--card);
  border:1px solid var(--line);
  padding:18px;
  border-radius:16px;
}

.stat small{
  color:var(--muted);
}

.stat b{
  display:block;
  color:var(--wine);
  font-size:25px;
  margin-top:5px;
}

.tabs{
  display:flex;
  gap:8px;
  margin:25px 0;
  flex-wrap:wrap;
}

.tab{
  padding:10px 17px;
  border:1px solid var(--line);
  background:#fff;
  border-radius:22px;
  color:var(--text);
  font-weight:bold;
}

.tab.active{
  background:var(--wine);
  color:#fff;
  border-color:var(--wine);
}

.panel{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
  margin-bottom:20px;
  overflow:auto;
}

.panel h2{
  font:25px Georgia,serif;
  color:var(--wine);
  margin-top:0;
}

.panel h3{
  color:var(--wine);
  font-family:Georgia,serif;
}

.panel-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:760px;
}

th,
td{
  text-align:left;
  padding:12px;
  border-bottom:1px solid #eee;
  font-size:13px;
  vertical-align:middle;
}

th{
  color:var(--wine);
  background:#fcf8f1;
}

.pill{
  padding:5px 9px;
  border-radius:14px;
  font-size:11px;
  font-weight:bold;
  display:inline-block;
}

.paid{
  background:#e5f5ea;
  color:#176a35;
}

.pending{
  background:#fff1cf;
  color:#8a5a00;
}

.failed{
  background:#fde7e7;
  color:#9a2222;
}

.actions{
  white-space:nowrap;
}

.actions button{
  padding:7px 10px;
  border-radius:15px;
  border:1px solid var(--line);
  background:#fff;
  margin-right:5px;
  color:var(--wine);
}

.actions .delete-btn{
  color:#a33;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px 15px;
  max-width:850px;
}

.full{
  grid-column:1 / -1;
}

.form-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:5px;
}

.save-btn{
  background:var(--wine);
  color:#fff;
  border:0;
  padding:12px 20px;
  border-radius:22px;
  font-weight:bold;
}

.cancel-btn{
  background:#fff;
  color:#333;
  border:1px solid var(--line);
  padding:12px 20px;
  border-radius:22px;
}

.photo-box{
  border:2px dashed var(--line);
  border-radius:15px;
  padding:20px;
  text-align:center;
  background:#fcf8f1;
}

.photo-button{
  display:inline-block;
  background:var(--wine);
  color:#fff;
  padding:12px 20px;
  border-radius:22px;
  font-weight:bold;
  cursor:pointer;
}

.photo-button input{
  display:none;
}

.photo-preview{
  display:none;
  margin:15px auto 5px;
  width:180px;
  height:220px;
  object-fit:cover;
  border-radius:12px;
  border:1px solid var(--line);
}

.product-thumb{
  width:55px;
  height:65px;
  object-fit:cover;
  border-radius:8px;
  background:#f5eee7;
}

.product-empty{
  width:55px;
  height:65px;
  border-radius:8px;
  background:#f5eee7;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  color:#999;
  text-align:center;
}

.loading,
.empty-message{
  padding:25px;
  text-align:center;
  color:#777;
}

.color-row{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:10px;
}

.color-row input[type="color"]{
  width:60px;
  height:45px;
  padding:3px;
  margin:0;
}

.color-code{
  flex:1;
  margin:0;
}

.preview-box{
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  margin-top:15px;
}

.preview-header{
  padding:12px 15px;
  background:var(--wine);
  color:#fff;
  font-weight:bold;
}

.preview-body{
  padding:20px;
  background:#f7f2eb;
}

.preview-button{
  display:inline-block;
  background:var(--wine);
  color:#fff;
  padding:10px 17px;
  border-radius:20px;
  font-weight:bold;
}

.settings-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.setting-card{
  border:1px solid var(--line);
  border-radius:15px;
  padding:18px;
  background:#fff;
}

.setting-card h3{
  margin-top:0;
}

.password-wrap{
  position:relative;
}

.password-wrap input{
  padding-right:55px;
}

.show-pass{
  position:absolute;
  right:8px;
  top:10px;
  border:0;
  background:transparent;
  color:var(--wine);
  font-size:12px;
  font-weight:bold;
}

.two-buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:12px;
  background:#e5f5ea;
  color:#176a35;
  font-size:11px;
  font-weight:bold;
}

.danger-box{
  border:1px solid #efd0d0;
  background:#fff7f7;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
}

@media(max-width:850px){
  .cards{
    grid-template-columns:1fr 1fr;
  }

  .settings-grid,
  .form-grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }
}

@media(max-width:500px){
  .cards{
    grid-template-columns:1fr;
  }

  .top{
    padding:12px 14px;
  }

  .top b{
    font-size:17px;
  }

  .top small{
    font-size:10px;
  }

  .layout{
    padding:18px 12px 40px;
  }

  .login{
    padding:25px 20px;
  }

  .panel{
    padding:15px;
  }
}
</style>
</head>

<body>

<div class="top">

  <div>
    <b>FACE OF STYLE — ADMIN</b>
    <small>Hijab Factory Management Panel</small>
  </div>

  <button
    class="logout"
    onclick="logout()"
  >
    Logout
  </button>

</div>

<div id="app"></div>

<script>

const app =
  document.getElementById('app');

let token =
  sessionStorage.getItem('adminToken') || '';

let editingProductId = null;

let selectedImageData = '';

let settingsData = {};


/* =====================================================
   LOGIN
===================================================== */

function login(){

  app.innerHTML = `

    <div class="login-wrap">

      <div class="login">

        <div class="login-logo">
          FS
        </div>

        <h1>
          Admin Login
        </h1>

        <div class="login-sub">
          Face of Style Hijab Factory
        </div>

        <label>
          <b>Username</b>
        </label>

        <input
          id="u"
          autocomplete="username"
          placeholder="Admin username"
        >

        <label>
          <b>Password</b>
        </label>

        <div class="password-wrap">

          <input
            id="p"
            type="password"
            autocomplete="current-password"
            placeholder="Admin password"
          >

          <button
            type="button"
            class="show-pass"
            onclick="togglePassword('p',this)"
          >
            SHOW
          </button>

        </div>

        <button
          class="primary"
          id="loginButton"
          onclick="doLogin()"
        >
          LOGIN
        </button>

        <p
          id="err"
          class="error"
        ></p>

        <button
          type="button"
          class="secondary"
          style="width:100%;margin-top:5px"
          onclick="forgotPassword()"
        >
          FORGOT PASSWORD?
        </button>

        <div class="notice">
          Your admin credentials are protected
          on the server. Never share your admin
          password or secret keys.
        </div>

      </div>

    </div>

  `;

  const username =
    localStorage.getItem('rememberAdminUser');

  if(username){

    document.getElementById('u').value =
      username;

  }

}


/* =====================================================
   LOGIN ACTION
===================================================== */

async function doLogin(){

  const username =
    document.getElementById('u')
      .value
      .trim();

  const password =
    document.getElementById('p')
      .value;

  const errorBox =
    document.getElementById('err');

  const button =
    document.getElementById('loginButton');

  errorBox.textContent = '';

  if(!username || !password){

    errorBox.textContent =
      'Please enter your username and password.';

    return;

  }

  button.disabled = true;

  button.textContent =
    'LOGGING IN...';

  try{

    const r =
      await fetch(
        '/api/admin/login',
        {
          method:'POST',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:
            JSON.stringify({
              username,
              password
            })
        }
      );

    const d =
      await r.json();

    if(d.token){

      token = d.token;

      sessionStorage.setItem(
        'adminToken',
        token
      );

      localStorage.setItem(
        'rememberAdminUser',
        username
      );

      dashboard();

    }else{

      errorBox.textContent =
        d.message ||
        'Invalid login details.';

      button.disabled = false;

      button.textContent =
        'LOGIN';

    }

  }catch(error){

    console.error(error);

    errorBox.textContent =
      'Unable to connect to server.';

    button.disabled = false;

    button.textContent =
      'LOGIN';

  }

}


/* =====================================================
   FORGOT PASSWORD
===================================================== */

function forgotPassword(){

  app.innerHTML = `

    <div class="login-wrap">

      <div class="login">

        <div class="login-logo">
          🔐
        </div>

        <h1>
          Password Recovery
        </h1>

        <div class="login-sub">
          Secure Admin Password Reset
        </div>

        <div class="notice">

          For security, password recovery
          must be completed through the
          server environment.

          <br><br>

          If you have access to Render,
          update the environment variable:

          <br><br>

          <b>ADMIN_PASSWORD</b>

          <br><br>

          Then redeploy the service.

        </div>

        <button
          class="primary"
          style="margin-top:18px"
          onclick="login()"
        >
          BACK TO LOGIN
        </button>

      </div>

    </div>

  `;

}


/* =====================================================
   PASSWORD TOGGLE
===================================================== */

function togglePassword(id,button){

  const input =
    document.getElementById(id);

  if(!input){

    return;

  }

  if(input.type === 'password'){

    input.type = 'text';

    button.textContent =
      'HIDE';

  }else{

    input.type = 'password';

    button.textContent =
      'SHOW';

  }

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

  if(token){

    try{

      await fetch(
        '/api/admin/logout',
        {
          method:'POST',
          headers:{
            Authorization:
              'Bearer ' + token
          }
        }
      );

    }catch(error){

      console.error(error);

    }

  }

  sessionStorage.removeItem(
    'adminToken'
  );

  token = '';

  editingProductId = null;

  selectedImageData = '';

  login();

}


/* =====================================================
   API HELPER
===================================================== */

async function api(
  url,
  opts = {}
){

  opts.headers = {
    ...(opts.headers || {}),
    Authorization:
      'Bearer ' + token
  };

  try{

    const r =
      await fetch(
        url,
        opts
      );

    if(r.status === 401){

      logout();

      return null;

    }

    const text =
      await r.text();

    if(!text){

      return {};

    }

    try{

      return JSON.parse(text);

    }catch{

      return {
        ok:false,
        message:text
      };

    }

  }catch(error){

    console.error(error);

    alert(
      'Could not connect to the server.'
    );

    return null;

  }

}


/* =====================================================
   DASHBOARD
===================================================== */

async function dashboard(){

  const d =
    await api(
      '/api/admin/dashboard'
    );

  if(!d){

    return;

  }

  app.innerHTML = `

    <div class="layout">

      <div class="cards">

        <div class="stat">
          <small>Total Orders</small>
          <b>
            ${d.stats?.orders || 0}
          </b>
        </div>

        <div class="stat">
          <small>Paid Orders</small>
          <b>
            ${d.stats?.paid || 0}
          </b>
        </div>

        <div class="stat">
          <small>Pending Orders</small>
          <b>
            ${d.stats?.pending || 0}
          </b>
        </div>

        <div class="stat">
          <small>Total Revenue</small>
          <b>
            ₦${Number(
              d.stats?.revenue || 0
            ).toLocaleString('en-NG')}
          </b>
        </div>

      </div>

      <div class="tabs">

        <button
          id="tabOrders"
          class="tab active"
          onclick="showOrders()"
        >
          Orders
        </button>

        <button
          id="tabProducts"
          class="tab"
          onclick="showProducts()"
        >
          Products
        </button>

        <button
          id="tabSettings"
          class="tab"
          onclick="showSettings()"
        >
          Settings
        </button>

      </div>

      <div id="content"></div>

    </div>

  `;

  showOrders();

}


/* =====================================================
   ACTIVE TAB
===================================================== */

function activeTab(name){

  document
    .querySelectorAll('.tab')
    .forEach(
      x =>
        x.classList.remove('active')
    );

  const tab =
    document.getElementById(
      'tab' +
      name
    );

  if(tab){

    tab.classList.add('active');

  }

}


/* =====================================================
   ORDERS
===================================================== */

async function showOrders(){

  activeTab('Orders');

  const d =
    await api(
      '/api/admin/orders'
    );

  if(!d){

    return;

  }

  const content =
    document.getElementById(
      'content'
    );

  const orders =
    Array.isArray(d.orders)
      ? d.orders
      : [];

  content.innerHTML = `

    <div class="panel">

      <div class="panel-header">

        <div>

          <h2>
            Customer Orders
          </h2>

          <p style="color:#777">
            View customer orders and payment status.
          </p>

        </div>

        <button
          class="secondary"
          onclick="showOrders()"
        >
          ↻ Refresh
        </button>

      </div>

      ${
        orders.length
        ? `

          <table>

            <thead>

              <tr>

                <th>Reference</th>
                <th>Customer</th>
                <th>Total</th>
                <th>Payment</th>
                <th>Status</th>
                <th>Date</th>
                <th>Action</th>

              </tr>

            </thead>

            <tbody>

              ${orders.map(o => `

                <tr>

                  <td>
                    ${escapeHtml(
                      o.reference || '-'
                    )}
                  </td>

                  <td>

                    <b>
                      ${escapeHtml(
                        o.customer?.name || '-'
                      )}
                    </b>

                    <br>

                    <span style="color:#777">
                      ${escapeHtml(
                        o.customer?.phone || '-'
                      )}
                    </span>

                  </td>

                  <td>
                    ₦${Number(
                      o.total || 0
                    ).toLocaleString('en-NG')}
                  </td>

                  <td>
                    ${escapeHtml(
                      o.payment?.provider || '-'
                    )}
                  </td>

                  <td>

                    <span
                      class="pill ${
                        o.status === 'paid'
                          ? 'paid'
                          : o.status === 'failed'
                            ? 'failed'
                            : 'pending'
                      }"
                    >
                      ${escapeHtml(
                        o.status || 'pending'
                      )}
                    </span>

                  </td>

                  <td>
                    ${
                      o.createdAt
                      ? new Date(
                          o.createdAt
                        ).toLocaleString()
                      : '-'
                    }
                  </td>

                  <td class="actions">

                    <button
                      onclick="viewOrder('${escapeAttr(o.id)}')"
                    >
                      View
                    </button>

                  </td>

                </tr>

              `).join('')}

            </tbody>

          </table>

        `
        : `

          <div class="empty-message">
            No customer orders yet.
          </div>

        `
      }

    </div>

  `;

}


/* =====================================================
   VIEW ORDER
===================================================== */

async function viewOrder(id){

  const d =
    await api(
      '/api/admin/orders/' +
      encodeURIComponent(id)
    );

  if(!d){

    return;

  }

  const o =
    d.order;

  if(!o){

    alert(
      'Order not found.'
    );

    return;

  }

  const items =
    Array.isArray(o.items)
      ? o.items
      : [];

  alert(
`ORDER DETAILS

Reference:
${o.reference || o.id}

Customer:
${o.customer?.name || '-'}

Phone:
${o.customer?.phone || '-'}

Email:
${o.customer?.email || '-'}

Total:
₦${Number(
  o.total || 0
).toLocaleString('en-NG')}

Status:
${o.status || '-'}

Items:
${items.map(
  x =>
    `${x.name || '-'} × ${x.qty || 0}`
).join('\n') || '-'}

Delivery Address:
${o.customer?.address || '-'}`
  );

}


/* =====================================================
   PRODUCTS
===================================================== */

async function showProducts(){

  activeTab('Products');

  const d =
    await api(
      '/api/admin/products'
    );

  if(!d){

    return;

  }

  const content =
    document.getElementById(
      'content'
    );

  const products =
    Array.isArray(d.products)
      ? d.products
      : [];

  content.innerHTML = `

    <div class="panel">

      <div class="panel-header">

        <div>

          <h2>
            Products
          </h2>

          <p style="color:#777">
            Manage products, prices, colours,
            descriptions and photos.
          </p>

        </div>

        <button
          onclick="addProduct()"
          style="
            padding:12px 18px;
            border:0;
            border-radius:10px;
            background:var(--wine);
            color:#fff;
            font-weight:bold;
          "
        >
          + Add New Product
        </button>

      </div>

      <div
        style="
          overflow-x:auto;
          margin-top:20px;
        "
      >

        ${
          products.length
          ? `

            <table>

              <thead>

                <tr>
                  <th>Photo</th>
                  <th>Name</th>
                  <th>Category</th>

/* =====================================================
   IMAGE SELECT
===================================================== */

async function handleImageSelect(event){

  const file =
    event.target.files?.[0];

  if(!file){

    return;

  }

  if(!file.type.startsWith('image/')){

    alert(
      'Please choose an image file.'
    );

    event.target.value = '';

    return;

  }

  try{

    const status =
      document.getElementById(
        'photoStatus'
      );

    if(status){

      status.textContent =
        'Preparing photo...';

    }

    selectedImageData =
      await compressImage(file);

    const preview =
      document.getElementById(
        'photoPreview'
      );

    if(preview){

      preview.src =
        selectedImageData;

      preview.style.display =
        'block';

    }

    if(status){

      status.textContent =
        'Photo selected successfully ✓';

    }

  }catch(error){

    console.error(error);

    selectedImageData = '';

    alert(
      'Could not prepare this photo.'
    );

  }

}


/* =====================================================
   IMAGE COMPRESSION
===================================================== */

function compressImage(file){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();

      reader.onload =
        function(e){

          const img =
            new Image();

          img.onload =
            function(){

              const maxWidth =
                900;

              const scale =
                Math.min(
                  1,
                  maxWidth / img.width
                );

              const width =
                Math.round(
                  img.width * scale
                );

              const height =
                Math.round(
                  img.height * scale
                );

              const canvas =
                document.createElement(
                  'canvas'
                );

              canvas.width =
                width;

              canvas.height =
                height;

              const ctx =
                canvas.getContext(
                  '2d'
                );

              if(!ctx){

                reject(
                  new Error(
                    'Canvas is not supported.'
                  )
                );

                return;

              }

              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );

              resolve(
                canvas.toDataURL(
                  'image/jpeg',
                  0.78
                )
              );

            };

          img.onerror =
            reject;

          img.src =
            e.target.result;

        };

      reader.onerror =
        reject;

      reader.readAsDataURL(file);

    }
  );

}


/* =====================================================
   SAVE PRODUCT
===================================================== */

async function saveProduct(e){

  e.preventDefault();

  const name =
    document.getElementById(
      'pName'
    ).value.trim();

  const cat =
    document.getElementById(
      'pCat'
    ).value;

  const price =
    Number(
      document.getElementById(
        'pPrice'
      ).value
    );

  const color =
    document.getElementById(
      'pColor'
    ).value.trim();

  const desc =
    document.getElementById(
      'pDesc'
    ).value.trim();

  if(
    !name ||
    !cat ||
    !price ||
    !color
  ){

    alert(
      'Please complete all required fields.'
    );

    return;

  }

  if(
    !selectedImageData &&
    !editingProductId
  ){

    alert(
      'Please choose a product photo.'
    );

    return;

  }

  const saveButton =
    document.querySelector(
      '#productForm .save-btn'
    );

  if(!saveButton){

    return;

  }

  saveButton.disabled =
    true;

  saveButton.textContent =
    editingProductId
      ? 'UPDATING...'
      : 'SAVING...';

  try{

    let imageToSave =
      selectedImageData;

    if(
      editingProductId &&
      !imageToSave
    ){

      const existing =
        await api(
          '/api/admin/products'
        );

      const product =
        existing?.products?.find(
          x =>
            Number(x.id) ===
            Number(editingProductId)
        );

      imageToSave =
        product?.img || '';

    }

    const data = {

      name,
      cat,
      price,
      color,
      img:imageToSave,
      desc

    };

    let result;

    if(editingProductId){

      result =
        await api(
          '/api/admin/products/' +
          editingProductId,
          {

            method:'PUT',

            headers:{
              'Content-Type':
                'application/json'
            },

            body:
              JSON.stringify(data)

          }
        );

    }else{

      result =
        await api(
          '/api/admin/products',
          {

            method:'POST',

            headers:{
              'Content-Type':
                'application/json'
            },

            body:
              JSON.stringify(data)

          }
        );

    }

    if(
      result &&
      result.ok
    ){

      alert(
        editingProductId
          ? 'Product updated successfully.'
          : 'Product added successfully.'
      );

      editingProductId =
        null;

      selectedImageData =
        '';

      showProducts();

    }else{

      alert(
        result?.message ||
        'Could not save product.'
      );

      saveButton.disabled =
        false;

      saveButton.textContent =
        editingProductId
          ? 'UPDATE PRODUCT'
          : 'SAVE PRODUCT';

    }

  }catch(error){

    console.error(error);

    alert(
      'Server error. Product was not saved.'
    );

    saveButton.disabled =
      false;

    saveButton.textContent =
      editingProductId
        ? 'UPDATE PRODUCT'
        : 'SAVE PRODUCT';

  }

}

async function deleteProduct(id){

    alert(
      'Product not found.'
    );

    return;

  }

  const confirmed =
    confirm(
      `Are you sure you want to delete "${p.name}"?`
    );

  if(!confirmed){

    return;

  }

  const result =
    await api(
      '/api/admin/products/' +
      id,
      {
        method:'DELETE'
      }
    );

  if(
    result &&
    result.ok
  ){

    alert(
      'Product deleted successfully.'
    );

    showProducts();

  }else{

    alert(
      result?.message ||
      'Could not delete product.'
    );

  }

/* =====================================================
   SYNC COLOUR INPUT
===================================================== */

function syncColorInput(type){

  if(type === 'wine'){

    const text =
      document.getElementById(
        'wineCode'
      );

    const color =
      document.getElementById(
        'wineColor'
      );

    if(
      text &&
      color &&
      /^#[0-9a-fA-F]{6}$/.test(
        text.value.trim()
      )
    ){

      color.value =
        text.value.trim();

    }

  }

  if(type === 'gold'){

    const text =
      document.getElementById(
        'goldCode'
      );

    const color =
      document.getElementById(
        'goldColor'
      );

    if(
      text &&
      color &&
      /^#[0-9a-fA-F]{6}$/.test(
        text.value.trim()
      )
    ){

      color.value =
        text.value.trim();

    }

  }

  updateColorPreview();

}

  const gold =
    document.getElementById(
      'goldCode'
    )?.value
      .trim();

  const message =

  if(
    !/^#[0-9a-fA-F]{6}$/.test(wine) ||
    !/^#[0-9a-fA-F]{6}$/.test(gold)

    if(message){

      'SAVING...';

      await api(
        '/api/admin/settings/colors',

          method:'PUT',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:
            JSON.stringify({

            })

      );

      result &&
      result.ok
    ){

      if(message){

        message.innerHTML =

    if(message){

      message.innerHTML =

    }

  }finally{

    if(button){

      button.disabled =
        false;

      button.textContent =
        'SAVE COLOURS';

    }

  }

}


/* =====================================================
   HTML SAFETY
===================================================== */

function escapeHtml(value){

  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


function escapeAttr(value){

  return escapeHtml(value);

}
