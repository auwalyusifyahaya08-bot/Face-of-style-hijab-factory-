<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  Face of Style — Admin Dashboard
</title>

<style>

:root{
  --wine:#651630;
  --wine2:#7b1b3b;
  --gold:#c9a45b;
  --bg:#f7f2eb;
  --paper:#fff;
  --line:#e6dacf;
  --text:#292025;
  --muted:#756a6f;
  --green:#176a35;
  --red:#9a2222;
  --yellow:#8a5a00;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.top{
  position:sticky;
  top:0;
  z-index:50;
  background:#fff;
  border-bottom:1px solid var(--line);
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.brand{
  color:var(--wine);
  font:700 21px Georgia,serif;
}

.logout{
  border:1px solid var(--line);
  background:#fff;
  padding:9px 16px;
  border-radius:22px;
}

.logout:hover{
  border-color:var(--wine);
  color:var(--wine);
}

.layout{
  max-width:1500px;
  margin:auto;
  padding:22px 16px 50px;
}

/* =========================================================
   LOGIN
========================================================= */

.login{
  max-width:440px;
  margin:9vh auto;
  background:#fff;
  border:1px solid var(--line);
  border-radius:22px;
  padding:30px;
  box-shadow:0 10px 35px rgba(45,15,25,.07);
}

.login h1{
  margin:0 0 8px;
  color:var(--wine);
  font:42px Georgia,serif;
}

.login p{
  color:var(--muted);
}

label{
  display:block;
  font-weight:600;
  margin:8px 0 6px;
}

input,
textarea,
select{
  width:100%;
  border:1px solid var(--line);
  background:#fff;
  border-radius:11px;
  padding:12px;
  outline:none;
}

textarea{
  min-height:90px;
  resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
  border-color:var(--wine);
}

.primary{
  width:100%;
  border:0;
  background:var(--wine);
  color:#fff;
  padding:13px;
  border-radius:24px;
  font-weight:bold;
}

.error{
  color:var(--red);
  min-height:20px;
}

/* =========================================================
   DASHBOARD
========================================================= */

.cards{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:12px;
}

.stat{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:17px;
}

.stat small{
  color:var(--muted);
}

.stat b{
  display:block;
  margin-top:5px;
  color:var(--wine);
  font-size:25px;
}

/* =========================================================
   TABS
========================================================= */

.tabs{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin:22px 0;
}

.tab{
  border:1px solid var(--line);
  background:#fff;
  padding:10px 14px;
  border-radius:21px;
  font-weight:600;
}

.tab.active{
  background:var(--wine);
  border-color:var(--wine);
  color:#fff;
}

/* =========================================================
   PANEL
========================================================= */

.panel{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
  overflow:auto;
}

.panel h2{
  margin-top:0;
  color:var(--wine);
  font:27px Georgia,serif;
}

.panelHead{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:14px;
  margin-bottom:17px;
}

.notice{
  background:#fcf8f1;
  border-radius:10px;
  padding:11px;
  color:#665d60;
  font-size:13px;
  line-height:1.6;
}

.addBtn{
  border:0;
  background:var(--wine);
  color:#fff;
  border-radius:23px;
  padding:11px 17px;
  font-weight:bold;
  white-space:nowrap;
}

/* =========================================================
   TABLE
========================================================= */

table{
  width:100%;
  border-collapse:collapse;
  min-width:900px;
}

th,
td{
  padding:11px 9px;
  border-bottom:1px solid var(--line);
  vertical-align:middle;
  text-align:left;
}

th{
  background:#fcf8f1;
  color:var(--wine);
  font-size:13px;
}

td{
  font-size:13px;
}

.pill{
  display:inline-block;
  padding:5px 9px;
  border-radius:14px;
  text-transform:uppercase;
  font-size:10px;
  font-weight:bold;
}

.paid,
.completed{
  color:var(--green);
  background:#e5f5ea;
}

.pending{
  color:var(--yellow);
  background:#fff1cf;
}

.failed,
.cancelled,
.rejected{
  color:var(--red);
  background:#fde7e7;
}

.processing{
  color:#31528a;
  background:#e9eefc;
}

.shipped,
.approved{
  color:#67409a;
  background:#eee7fa;
}

/* =========================================================
   PRODUCTS
========================================================= */

.productGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.productCard{
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  background:#fff;
}

.productCard img{
  width:100%;
  height:230px;
  object-fit:cover;
  display:block;
  background:#f4eee7;
}

.noPhoto{
  height:230px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f4eee7;
  color:var(--muted);
}

.productInfo{
  padding:14px;
}

.productInfo h3{
  color:var(--wine);
  font:20px Georgia,serif;
  margin:0 0 6px;
}

.meta{
  color:var(--muted);
  font-size:12px;
  line-height:1.7;
}

.price{
  color:var(--wine);
  font-size:18px;
  font-weight:bold;
  margin:8px 0;
}

.actions{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.actions button{
  flex:1;
  border:1px solid var(--line);
  background:#fff;
  padding:9px;
  border-radius:18px;
}

.actions .edit{
  background:#fff8e8;
}

.actions .delete{
  color:var(--red);
}

/* =========================================================
   FORM
========================================================= */

.formGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0 14px;
}

.full{
  grid-column:1/-1;
}

.preview{
  width:100%;
  max-height:300px;
  object-fit:cover;
  border-radius:12px;
  margin:6px 0;
  background:#f4eee7;
}

.colorRow{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
}

.colorInput{
  width:58px;
  height:45px;
  padding:3px;
}

/* =========================================================
   SETTINGS
========================================================= */

.settingsGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.settingCard{
  background:#fcf8f1;
  border-radius:14px;
  padding:15px;
}

.settingCard h3{
  color:var(--wine);
  margin-top:0;
}

.settingFull{
  grid-column:1/-1;
}

.systemRow{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.systemCard{
  background:#fff;
  border:1px solid var(--line);
  border-radius:13px;
  padding:13px;
}

.systemCard b{
  display:block;
  color:var(--wine);
  margin-bottom:4px;
}

/* =========================================================
   LOADING
========================================================= */

.loading,
.empty{
  padding:35px;
  text-align:center;
  color:var(--muted);
}

.mobileMenuNote{
  color:var(--muted);
  font-size:12px;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1100px){

  .cards{
    grid-template-columns:repeat(3,1fr);
  }

  .productGrid{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:800px){

  .cards{
    grid-template-columns:repeat(2,1fr);
  }

  .formGrid,
  .settingsGrid{
    grid-template-columns:1fr;
  }

  .settingFull{
    grid-column:auto;
  }

  .systemRow{
    grid-template-columns:1fr;
  }

}

@media(max-width:600px){

  .top{
    padding:11px 13px;
  }

  .brand{
    font-size:17px;
  }

  .layout{
    padding:15px 10px 40px;
  }

  .productGrid{
    grid-template-columns:1fr;
  }

  .panel{
    padding:14px;
  }

  .panelHead{
    flex-direction:column;
  }

  .addBtn{
    width:100%;
  }

  .login{
    margin:6vh 12px;
    padding:24px;
  }

  .cards{
    grid-template-columns:1fr 1fr;
  }

  .stat{
    padding:13px;
  }

  .stat b{
    font-size:21px;
  }

}

</style>
</head>

<body>

<div id="top" class="top">

  <b class="brand">
    FACE OF STYLE — ADMIN
  </b>

  <button
    id="logoutBtn"
    class="logout"
    onclick="logout()"
    style="display:none"
  >
    Logout
  </button>

</div>

<div id="app"></div>

<script>

"use strict";

/* =========================================================
   STATE
========================================================= */

let token =
  sessionStorage.getItem(
    "adminToken"
  ) || "";

let allProducts = [];

/* =========================================================
   HELPERS
========================================================= */

function esc(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}

function money(value){

  return new Intl.NumberFormat(
    "en-NG",
    {
      style:"currency",
      currency:"NGN",
      maximumFractionDigits:0
    }
  ).format(
    Number(value) || 0
  );

}

function imagePath(value){

  const src =
    String(
      value || ""
    ).trim();

  if(!src){
    return "";
  }

  if(
    src.startsWith("data:") ||
    src.startsWith("http://") ||
    src.startsWith("https://") ||
    src.startsWith("/")
  ){
    return src;
  }

  if(
    src.startsWith("assets/")
  ){
    return src;
  }

  return (
    "assets/" +
    src.replace(/^\.?\//,"")
  );

}

/* =========================================================
   LOGIN
========================================================= */

function login(){

  document
    .getElementById(
      "logoutBtn"
    )
    .style.display =
    "none";

  document.getElementById(
    "app"
  ).innerHTML = `

    <div class="login">

      <h1>
        Admin Login
      </h1>

      <p>
        Face of Style Hijab Factory
      </p>

      <label>
        Username
      </label>

      <input
        id="username"
        value="admin"
        autocomplete="username"
      >

      <label>
        Password
      </label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
      >

      <button
        class="primary"
        onclick="doLogin()"
        style="margin-top:5px"
      >
        LOGIN
      </button>

      <p
        id="loginError"
        class="error"
      ></p>

      <div class="notice">

        Use the
        <b>
          ADMIN_USERNAME
        </b>
        and
        <b>
          ADMIN_PASSWORD
        </b>
        configured on Render.

      </div>

    </div>

  `;

  document
    .getElementById(
      "password"
    )
    .addEventListener(
      "keydown",
      event => {

        if(
          event.key ===
          "Enter"
        ){
          doLogin();
        }

      }
    );

}

/* =========================================================
   DO LOGIN
========================================================= */

async function doLogin(){

  const username =
    document
      .getElementById(
        "username"
      )
      .value.trim();

  const password =
    document
      .getElementById(
        "password"
      )
      .value;

  const error =
    document
      .getElementById(
        "loginError"
      );

  error.textContent =
    "Logging in...";

  try{

    const response =
      await fetch(
        "/api/admin/login",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              username,
              password
            })
        }
      );

    const data =
      await response.json();

    if(
      !response.ok ||
      !data.token
    ){

      throw new Error(
        data.message ||
        "Login failed."
      );

    }

    token =
      data.token;

    sessionStorage.setItem(
      "adminToken",
      token
    );

    dashboard();

  }catch(error){

    error.textContent =
      error.message;

    error =
      null;

  }

}

/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

  try{

    if(token){

      await fetch(
        "/api/admin/logout",
        {
          method:"POST",

          headers:{
            Authorization:
              "Bearer " +
              token
          }
        }
      );

    }

  }catch{}

  sessionStorage.removeItem(
    "adminToken"
  );

  token = "";

  login();

}

/* =========================================================
   API
========================================================= */

async function api(
  url,
  options={}
){

  options.headers = {
    ...(options.headers || {}),
    Authorization:
      "Bearer " +
      token
  };

  const response =
    await fetch(
      url,
      options
    );

  if(
    response.status ===
    401
  ){

    logout();

    return null;

  }

  const data =
    await response.json();

  return data;

}

/* =========================================================
   DASHBOARD
========================================================= */

async function dashboard(){

  document
    .getElementById(
      "logoutBtn"
    )
    .style.display =
    "block";

  document
    .getElementById(
      "app"
    )
    .innerHTML = `

      <div class="layout">

        <div class="loading">
          Loading dashboard...
        </div>

      </div>
    `;

  const data =
    await api(
      "/api/admin/dashboard"
    );

  if(!data){
    return;
  }

  if(!data.ok){

    document
      .getElementById(
        "app"
      )
      .innerHTML = `

        <div class="layout">

          <div class="panel">

            <h2>
              Dashboard Error
            </h2>

            <div class="notice">
              ${esc(
                data.message ||
                "Unable to load dashboard."
              )}
            </div>

          </div>

        </div>
      `;

    return;
  }

  const s =
    data.stats ||
    {};

  document
    .getElementById(
      "app"
    )
    .innerHTML = `

      <div class="layout">

        <div class="cards">

          <div class="stat">
            <small>Total Orders</small>
            <b>${s.orders || 0}</b>
          </div>

          <div class="stat">
            <small>Paid Orders</small>
            <b>${s.paid || 0}</b>
          </div>

          <div class="stat">
            <small>Customers</small>
            <b>${s.customers || 0}</b>
          </div>

          <div class="stat">
            <small>Products</small>
            <b>${s.products || 0}</b>
          </div>

          <div class="stat">
            <small>Pending Refunds</small>
            <b>${s.refunds || 0}</b>
          </div>

          <div class="stat">
            <small>Revenue</small>
            <b>${money(
              s.revenue
            )}</b>
          </div>

        </div>

        <div class="tabs">

          <button
            id="tabDashboard"
            class="tab active"
            onclick="showDashboardTab()"
          >
            Dashboard
          </button>

          <button
            id="tabOrders"
            class="tab"
            onclick="showOrders()"
          >
            Orders
          </button>

          <button
            id="tabProducts"
            class="tab"
            onclick="showProducts()"
          >
            Products
          </button>

          <button
            id="tabCustomers"
            class="tab"
            onclick="showCustomers()"
          >
            Customers
          </button>

          <button
            id="tabCredit"
            class="tab"
            onclick="showCredit()"
          >
            Store Credit
          </button>

          <button
            id="tabPayments"
            class="tab"
            onclick="showPayments()"
          >
            Payments
          </button>

          <button
            id="tabRefunds"
            class="tab"
            onclick="showRefunds()"
          >
            Refunds
          </button>

          <button
            id="tabSettings"
            class="tab"
            onclick="showSettings()"
          >
            Settings / Developer
          </button>

        </div>

        <div id="content"></div>

      </div>

    `;

  showDashboardTab();

}

/* =========================================================
   TAB ACTIVE
========================================================= */

function activateTab(
  id
){

  document
    .querySelectorAll(
      ".tab"
    )
    .forEach(
      btn =>
        btn.classList.remove(
          "active"
        )
    );

  const element =
    document.getElementById(
      id
    );

  if(element){

    element.classList.add(
      "active"
    );

  }

}

function showDashboardTab(){

  activateTab(
    "tabDashboard"
  );

  document
    .getElementById(
      "content"
    )
    .innerHTML = `

      <div class="panel">

        <h2>
          Face of Style Version 2
        </h2>

        <div class="notice">

          Master administration area for
          Orders, Products, Customers,
          Store Credit, Payments, Refunds
          and Developer Settings.

        </div>

      </div>

    `;

}

/* =========================================================
   ORDERS
========================================================= */

async function showOrders(){

  activateTab(
    "tabOrders"
  );

  const content =
    document.getElementById(
      "content"
    );

  content.innerHTML = `
    <div class="panel">
      <div class="loading">
        Loading orders...
      </div>
    </div>
  `;

  const data =
    await api(
      "/api/admin/orders"
    );

  if(!data){
    return;
  }

  if(!data.ok){

    content.innerHTML = `
      <div class="panel">
        <h2>Orders</h2>

        <div class="notice">
          ${esc(
            data.message ||
            "Unable to load orders."
          )}
        </div>
      </div>
    `;

    return;
  }

  const orders =
    data.orders ||
    [];

  if(!orders.length){

    content.innerHTML = `
      <div class="panel">
        <h2>Orders</h2>

        <div class="empty">
          No orders yet.
        </div>
      </div>
    `;

    return;
  }

  content.innerHTML = `

    <div class="panel">

      <div class="panelHead">

        <div>

          <h2>
            Customer Orders
          </h2>

          <div class="notice">
            Payment status and
            delivery status are separated.
          </div>

        </div>

        <button
          class="addBtn"
          onclick="showOrders()"
        >
          ↻ Refresh
        </button>

      </div>

      <table>

        <thead>

          <tr>
            <th>Reference</th>
            <th>Customer</th>
            <th>Total</th>
            <th>Payment</th>
            <th>Order Status</th>
            <th>Date</th>
            <th>Refund</th>
          </tr>

        </thead>

        <tbody>

          ${orders.map(
            order => `

              <tr>

                <td>
                  <b>
                    ${esc(
                      order.reference ||
                      "-"
                    )}
                  </b>
                </td>

                <td>
                  <b>
                    ${esc(
                      order.customer_name ||
                      "-"
                    )}
                  </b>

                  <br>

                  ${esc(
                    order.customer_phone ||
                    "-"
                  )}

                  <br>

                  ${esc(
                    order.customer_email ||
                    "-"
                  )}
                </td>

                <td>
                  ${money(
                    order.total
                  )}
                </td>

                <td>

                  <span
                    class="pill ${
                      String(
                        order.payment_status
                      ).toLowerCase()
                    }"
                  >
                    ${esc(
                      order.payment_status ||
                      "PENDING"
                    )}
                  </span>

                </td>

                <td>

                  <select
                    onchange="
                      updateOrderStatus(
                        '${order.id}',
                        this.value
                      )
                    "
                    style="width:auto"
                  >

                    <option
                      value="PENDING"
                      ${
                        order.order_status ===
                        "PENDING"
                          ? "selected"
                          : ""
                      }
                    >
                      PENDING
                    </option>

                    <option
                      value="PROCESSING"
                      ${
                        order.order_status ===
                        "PROCESSING"
                          ? "selected"
                          : ""
                      }
                    >
                      PROCESSING
                    </option>

                    <option
                      value="SHIPPED"
                      ${
                        order.order_status ===
                        "SHIPPED"
                          ? "selected"
                          : ""
                      }
                    >
                      SHIPPED
                    </option>

                    <option
                      value="DELIVERED"
                      ${
                        order.order_status ===
                        "DELIVERED"
                          ? "selected"
                          : ""
                      }
                    >
                      DELIVERED
                    </option>

                    <option
                      value="CANCELLED"
                      ${
                        order.order_status ===
                        "CANCELLED"
                          ? "selected"
                          : ""
                      }
                    >
                      CANCELLED
                    </option>

                  </select>

                </td>

                <td>
                  ${formatDate(
                    order.created_at
                  )}
                </td>

                <td>

                  <button
                    class="smallBtn"
                    onclick="
                      createRefund(
                        '${order.id}',
                        '${order.total}'
                      )
                    "
                  >
                    Refund
                  </button>

                </td>

              </tr>

            `
          ).join("")}

        </tbody>

      </table>

    </div>
  `;

}

async function updateOrderStatus(
  id,
  status
){

  const data =
    await api(
      "/api/admin/orders/" +
      id,
      {
        method:"PATCH",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            order_status:
              status
          })
      }
    );

  if(
    data?.ok
  ){

    showOrders();

function previewPhoto(){

  const fileInput =
    document.getElementById(
      "productImage"
    );

  const preview =
    document.getElementById(
      "photoPreview"
    );

  if(
    !fileInput ||
    !preview
  ){
    return;
  }

  const file =
    fileInput.files?.[0];

  if(!file){
    return;
  }

  if(
    file.size >
    2000000
  ){

    alert(
      "Please choose an image smaller than 2MB."
    );

    fileInput.value = "";

    return;
  }

  const reader =
    new FileReader();

  reader.onload =
    () => {

      preview.src =
        reader.result;

      preview.style.display =
        "block";

    };

  reader.readAsDataURL(
    file
  );

}

function fileToDataURL(
  file
){

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const reader =
        new FileReader();

      reader.onload =
        () =>
          resolve(
            reader.result
          );

      reader.onerror =
        reject;

      reader.readAsDataURL(
        file
      );

    }
  );

}

async function saveProduct(
  id
){

  const name =
    document
      .getElementById(
        "productName"
      )
      .value.trim();

  const category =
    document
      .getElementById(
        "productCategory"
      )
      .value;

  const price =
    Number(
      document
        .getElementById(
          "productPrice"
        )
        .value
    );

  const stock =
    Number(
      document
        .getElementById(
          "productStock"
        )
        .value
    );

  const color =
    document
      .getElementById(
        "productColor"
      )
      .value.trim();

  const description =
    document
      .getElementById(
        "productDescription"
      )
      .value.trim();

  if(!name){

    alert(
      "Product name is required."
    );

    return;
  }

  if(
    !Number.isFinite(price) ||
    price < 0
  ){

    alert(
      "Enter a valid price."
    );

    return;
  }

  if(
    !Number.isInteger(stock) ||
    stock < 0
  ){

    alert(
      "Enter a valid stock quantity."
    );

    return;
  }

  const payload = {
    name,
    category,
    price,
    stock,
    color,
    description
  };

  const file =
    document
      .getElementById(
        "productImage"
      )
      ?.files?.[0];

  if(file){

    if(
      file.size >
      2000000
    ){

      alert(
        "Please choose an image smaller than 2MB."
      );

      return;
    }

    payload.image =
      await fileToDataURL(
        file
      );

  }

  const url =
    id
      ? "/api/admin/products/" +
        id
      : "/api/admin/products";

  const data =
    await api(
      url,
      {
        method:
          id
            ? "PUT"
            : "POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify(
            payload
          )
      }
    );

  if(
    data?.ok ||
    data?.product
  ){

    alert(
      id
        ? "Product updated successfully."
        : "Product added successfully."
    );

    showProducts();

  }else{

    alert(
      data?.message ||
      "Unable to save product."
    );

  }

}

  const note =

  const data =

async function saveSettings(){

  const payload = {

    store_name:
      document
        .getElementById(
          "settingStoreName"
        )
        .value.trim(),

    tagline:
      document
        .getElementById(
          "settingTagline"
        )
        .value.trim(),

    whatsapp:
      document
        .getElementById(
          "settingWhatsapp"
        )
        .value.trim(),

    primary_color:
      document
        .getElementById(
          "settingPrimary"
        )
        .value.trim(),

    secondary_color:
      document
        .getElementById(
          "settingSecondary"
        )
        .value.trim(),

    gold_color:
      document
        .getElementById(
          "settingGold"
        )
        .value.trim(),

    background_color:
      document
        .getElementById(
          "settingBackground"
        )
        .value.trim(),

    hero_title:
      document
        .getElementById(
          "settingHeroTitle"
        )
        .value.trim(),

    hero_text:
      document
        .getElementById(
          "settingHeroText"
        )
        .value.trim()

  };

  const data =
    await api(
      "/api/admin/settings",
      {
        method:"PUT",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify(
            payload
          )
      }
    );

  if(
    data?.ok
  ){

    alert(
      "Store settings saved successfully."
    );

    showSettings();

  }else{

    alert(
      data?.message ||
      "Unable to save settings."
    );

  }

}

function formatDate(
  value
){

  if(!value){
    return "-";
  }

  const date =
    new Date(value);

  if(
    Number.isNaN(
      date.getTime()
    )
  ){
    return esc(
      value
    );
  }

  return date.toLocaleString();

}
