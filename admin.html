<meta charset="utf-8">

<style>

*{

}

body{

}

button{

}

.top{

}

.top b{

}

.logout{

  border-radius:20px;
}

.layout{

}

.login{

.login h1{

input,

.cards{

.stat b{

}

.tabs{

<body>

<div class="top">
  <b>FACE OF STYLE — ADMIN</b>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<div id="app"></div>

<script>

const app = document.getElementById('app');

let token = sessionStorage.getItem('adminToken') || '';

let editingProductId = null;
let selectedImageData = '';

/* =========================
   LOGIN
========================= */

function login(){

  app.innerHTML = `
    <div class="login">

      <h1>Admin Login</h1>

      <p>Face of Style Hijab Factory</p>

      <label>Username</label>

      <input
        id="u"
        value="admin"
        autocomplete="username"
      >

      <label>Password</label>

      <input
        id="p"
        type="password"
        autocomplete="current-password"
      >

      <button
        class="primary"
        onclick="doLogin()"
      >
        LOGIN
      </button>

      <p id="err" class="error"></p>

      <div class="notice">
        For the live store, change the admin credentials
        in the server environment before publishing.
      </div>

    </div>
  `;
}


/* =========================
   LOGIN ACTION
========================= */

async function doLogin(){

  const username =
    document.getElementById('u').value.trim();

  const password =
    document.getElementById('p').value;

  try{

    const r = await fetch(
      '/api/admin/login',
      {
        method:'POST',
        headers:{
          'Content-Type':'application/json'
        },
        body:JSON.stringify({
          username,
          password
        })
      }
    );

    const d = await r.json();

    if(d.token){

      token = d.token;

      sessionStorage.setItem(
        'adminToken',
        token
      );

      dashboard();

    }else{

      document.getElementById('err').textContent =
        d.message || 'Login failed';

    }

  }catch(error){

    document.getElementById('err').textContent =
      'Unable to connect to server.';

  }
}


/* =========================
   LOGOUT
========================= */

function logout(){

  sessionStorage.removeItem('adminToken');

  token = '';

  login();
}


/* =========================
   API HELPER
========================= */

async function api(url,opts={}){

  opts.headers = {
    ...(opts.headers || {}),
    Authorization:'Bearer ' + token
  };

  const r = await fetch(url,opts);

  if(r.status === 401){

    logout();

    return null;
  }

  return r.json();
}

========================= */

/* =========================
   IMAGE SELECT
========================= */

async function handleImageSelect(event){

  const file =
    event.target.files?.[0];

  if(!file) return;

  if(!file.type.startsWith('image/')){

    alert('Please choose an image file.');

    event.target.value = '';

    return;
  }

  try{

    document.getElementById(
      'photoStatus'
    ).textContent =
      'Preparing photo...';

    selectedImageData =
      await compressImage(file);


    const preview =
      document.getElementById(
        'photoPreview'
      );

    preview.src =
      selectedImageData;

    preview.style.display =
      'block';


    document.getElementById(
      'photoStatus'
    ).textContent =
      'Photo selected successfully ✓';

  }catch(error){

    console.error(error);

    alert(
      'Could not prepare this photo. Please choose another image.'
    );

  }
}


/* =========================
   COMPRESS IMAGE
========================= */

function compressImage(file){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();

      reader.onload = function(e){

        const img =
          new Image();

        img.onload = function(){

          const maxWidth = 900;

          const scale =
            Math.min(
              1,
              maxWidth / img.width
            );

          const width =
            Math.round(
              img.width * scale
            );

          const height =
            Math.round(
              img.height * scale
            );


          const canvas =
            document.createElement(
              'canvas'
            );

          canvas.width =
            width;

          canvas.height =
            height;


          const ctx =
            canvas.getContext(
              '2d'
            );

          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );


          const data =
            canvas.toDataURL(
              'image/jpeg',
              0.78
            );

          resolve(data);

        };

        img.onerror =
          reject;

        img.src =
          e.target.result;
      };

      reader.onerror =
        reject;

      reader.readAsDataURL(file);

    }
  );
}


/* =========================
   SAVE PRODUCT
========================= */

async function saveProduct(e){

  e.preventDefault();

  const name =
    document.getElementById(
      'pName'
    ).value.trim();

  const cat =
    document.getElementById(
      'pCat'
    ).value;

  const price =
    Number(
      document.getElementById(
        'pPrice'
      ).value
    );

  const color =
    document.getElementById(
      'pColor'
    ).value.trim();

  const desc =
    document.getElementById(
      'pDesc'
    ).value.trim();


  if(
    !name ||
    !cat ||
    !price ||
    !color
  ){

    alert(
      'Please complete all required fields.'
    );

    return;
  }


  if(
    !selectedImageData &&
    !editingProductId
  ){

    alert(
      'Please choose a product photo.'
    );

    return;
  }


  const saveButton =
    document.querySelector(
      '#productForm .save-btn'
    );

  saveButton.disabled = true;

  saveButton.textContent =
    'SAVING...';


  try{

    let imageToSave =
      selectedImageData;


    /*
      When editing and no new photo
      was selected, keep the old image.
    */

    if(
      editingProductId &&
      !imageToSave
    ){

      const existing =
        await api(
          '/api/admin/products'
        );

      const product =
        existing?.products?.find(
          x =>
            Number(x.id) ===
            Number(editingProductId)
        );

      imageToSave =
        product?.img || '';

    }


    const data = {

      name,

      cat,

      price,

      color,

      img:imageToSave,

      desc

    };


    let result;


    if(editingProductId){

      result =
        await api(
          '/api/admin/products/' +
          editingProductId,
          {
            method:'PUT',

            headers:{
              'Content-Type':
                'application/json'
            },

            body:
              JSON.stringify(data)
          }
        );

    }else{

      result =
        await api(
          '/api/admin/products',
          {
            method:'POST',

            headers:{
              'Content-Type':
                'application/json'
            },

            body:
              JSON.stringify(data)
          }
        );

    }


    if(
      result &&
      result.ok
    ){

      alert(
        editingProductId
        ? 'Product updated successfully.'
        : 'Product added successfully.'
      );

      editingProductId = null;

      selectedImageData = '';

      showProducts();

    }else{

      alert(
        result?.message ||
        'Could not save product.'
      );

      saveButton.disabled = false;

      saveButton.textContent =
        'SAVE PRODUCT';
    }


  }catch(error){

    console.error(error);

    alert(
      'Server error. Product was not saved.'
    );

    saveButton.disabled = false;

    saveButton.textContent =
      'SAVE PRODUCT';
  }
}

              class="photo-preview"
              src="${escapeAttr(p.img || '')}"
              alt="Current photo"
              style="
                display:${p.img ? 'block' : 'none'};
              "
            >

            <p
              id="photoStatus"
              style="
                font-size:12px;
                color:#777;
                margin-bottom:0;
              "
            >
              ${
                p.img
                ? 'Current product photo'
                : 'No photo'
              }
            </p>

          </div>

        </label>


        <label>

          <b>Description</b>

          <textarea
            id="pDesc"
            rows="4"
            placeholder="Describe the product..."
          >${escapeHtml(p.desc || '')}</textarea>

        </label>


        <div class="form-actions">

          <button
            type="submit"
            class="save-btn"
          >
            UPDATE PRODUCT
          </button>

          <button
            type="button"
            class="cancel-btn"
            onclick="showProducts()"
          >
            CANCEL
          </button>

        </div>

      </form>

    </div>
  `;


  document
    .getElementById('pImgFile')
    .addEventListener(
      'change',
      handleImageSelect
    );


  document
    .getElementById('productForm')
    .addEventListener(
      'submit',
      saveProduct
    );
}


/* =========================
   DELETE PRODUCT
========================= */

async function deleteProduct(id){

  const d =
    await api('/api/admin/products');

  if(!d) return;


  const p =
    d.products.find(
      x =>
        Number(x.id) ===
        Number(id)
    );

  if(!p) return;


  const confirmed =
    confirm(
      `Are you sure you want to delete "${p.name}"?`
    );


  if(!confirmed) return;


  const result =
    await api(
      '/api/admin/products/' + id,
      {
        method:'DELETE'
      }
    );


  if(
    result &&
    result.ok
  ){

    alert(
      'Product deleted successfully.'
    );

    showProducts();

  }else{

    alert(
      result?.message ||
      'Could not delete product.'
    );

  }
}

/* =========================
   HTML SAFETY HELPERS
========================= */

function escapeHtml(value){

  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


function escapeAttr(value){

  return escapeHtml(value);

}
